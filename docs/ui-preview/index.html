<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phpbox Desktop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b9cff'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='monospace'>π</text></svg>">
<style>
:root{
  --r:12px;--r-sm:8px;--r-xs:6px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sidebar-width: 200px;
  --drawer-height: 160px;
  --content-max: 1200px;
  --content-pad-x: 40px;
}
:root,[data-theme="midnight"]{
  --bg:#0a0c10;--surface:#11141b;--surface-2:#171b24;--surface-3:#1c2130;
  --border:#222835;--border-2:#1a1f2a;
  --text:#e7ecf5;--text-dim:#8b95ab;--text-mute:#5b6578;
  --accent:#5b9cff;--accent-2:#74acff;--accent-bg:rgba(91,156,255,.13);
  --ok:#3dd68c;--ok-bg:rgba(61,214,140,.13);
  --warn:#f5a623;--warn-bg:rgba(245,166,35,.13);
  --danger:#ff5c5c;--danger-bg:rgba(255,92,92,.13);
  --purple:#8b5cf6;--shadow:0 8px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f7;--surface-3:#eef1f6;
  --border:#e2e6ee;--border-2:#eceff4;
  --text:#1a2030;--text-dim:#5d677a;--text-mute:#8f98a8;
  --accent:#3b82f6;--accent-2:#2563eb;--accent-bg:rgba(59,130,246,.10);
  --ok:#16a34a;--ok-bg:rgba(22,163,74,.12);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.12);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,.10);
  --purple:#8b5cf6;--shadow:0 8px 32px rgba(20,30,60,.10);
  color-scheme:light;
}
[data-theme="oled"]{
  --bg:#000;--surface:#08090b;--surface-2:#0f1115;--surface-3:#15181f;
  --border:#1a1e26;--border-2:#14171d;
  --text:#f5f7fa;--text-dim:#98a1b3;--text-mute:#5e6776;
  --accent:#60a5fa;--accent-2:#7db4fb;--accent-bg:rgba(96,165,250,.14);
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --danger:#f87171;--danger-bg:rgba(248,113,113,.14);
  --purple:#a78bfa;--shadow:0 8px 32px rgba(0,0,0,.8);
  color-scheme:dark;
}
[data-theme="forest"]{
  --bg:#0b1512;--surface:#101d18;--surface-2:#15241e;--surface-3:#1a2c25;
  --border:#22392f;--border-2:#1a2c24;
  --text:#e3efe9;--text-dim:#8aa89a;--text-mute:#5a7267;
  --accent:#4ade80;--accent-2:#6ee7a0;--accent-bg:rgba(74,222,128,.14);
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.14);
  --warn:#facc15;--warn-bg:rgba(250,204,21,.14);
  --danger:#f87171;--danger-bg:rgba(248,113,113,.14);
  --purple:#a78bfa;--shadow:0 8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
[data-theme="ocean"]{
  --bg:#080e1a;--surface:#0d1625;--surface-2:#122035;--surface-3:#182a44;
  --border:#1e3252;--border-2:#16273f;
  --text:#e0e8f5;--text-dim:#8ba3c7;--text-mute:#5a7194;
  --accent:#38bdf8;--accent-2:#5ecffa;--accent-bg:rgba(56,189,248,.14);
  --ok:#2dd4bf;--ok-bg:rgba(45,212,191,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --danger:#fb7185;--danger-bg:rgba(251,113,133,.14);
  --purple:#a78bfa;--shadow:0 8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
[data-theme="sakura"]{
  --bg:#fdf7f8;--surface:#fff;--surface-2:#fbeef2;--surface-3:#f7e4eb;
  --border:#f0d8e0;--border-2:#f7e8ee;
  --text:#3a2530;--text-dim:#7a5563;--text-mute:#a88793;
  --accent:#ec4899;--accent-2:#db2777;--accent-bg:rgba(236,72,153,.10);
  --ok:#059669;--ok-bg:rgba(5,150,105,.12);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.12);
  --danger:#e11d48;--danger-bg:rgba(225,29,72,.10);
  --purple:#a855f7;--shadow:0 8px 32px rgba(190,120,150,.15);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);font-size:14px;line-height:1.55;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .25s,color .25s;
}
.mono{font-family:var(--mono)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit;text-decoration:none}

.app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;height:100vh;transition:grid-template-columns .18s ease}
.app.resizing{transition:none}

/* 侧边栏 */
.sidebar{position:relative;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px 10px;gap:2px;transition:background .25s,border-color .25s;overflow:hidden;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px;flex-shrink:0}
.brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:19px;font-weight:600;flex-shrink:0;box-shadow:0 4px 14px var(--accent-bg)}
.brand-meta{min-width:0;overflow:hidden}
.brand-name{font-weight:600;letter-spacing:-.3px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-mute);margin-top:1px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-section{font-size:10.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;padding:14px 10px 4px;white-space:nowrap}
.nav-section:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13.5px;text-align:left;width:100%;transition:background .12s,color .12s;position:relative;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0;line-height:1}
.nav-badge{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--text-mute);background:var(--surface-2);padding:1px 6px;border-radius:20px;min-width:20px;text-align:center;flex-shrink:0}
.nav-item.active .nav-badge{background:var(--accent-bg);color:var(--accent)}
.sidebar-foot{display:flex;flex-direction:column;gap:2px;padding-top:10px;margin-top:4px;border-top:1px solid var(--border-2);flex-shrink:0}
.btn-ghost{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:12.5px;transition:background .12s,color .12s;white-space:nowrap;overflow:hidden}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-ghost svg{flex-shrink:0}
.sidebar-resizer{position:absolute;top:0;right:-3px;bottom:0;width:6px;cursor:col-resize;z-index:20;background:transparent;transition:background .15s}
.sidebar-resizer:hover,.sidebar-resizer.dragging{background:var(--accent);opacity:.45}

/* 主区 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative;transition:background .25s}
.view{flex:1;overflow-y:auto;min-height:0}
.view-inner{max-width:var(--content-max);margin:0 auto;padding:32px var(--content-pad-x) 60px;transition:max-width .2s,padding .2s}
.view-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.view-header h1{font-size:24px;font-weight:600;letter-spacing:-.4px;line-height:1.25}
.view-sub{color:var(--text-dim);font-size:13px;margin-top:4px}
.header-actions{display:flex;gap:8px;flex-shrink:0}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:500;transition:all .13s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-bg)}
.btn-primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover:not(:disabled){background:var(--danger-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-xs);color:var(--text-dim);transition:background .12s,color .12s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* 摘要 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.summary-item{background:var(--surface);padding:16px 18px}
.summary-num{font-size:22px;font-weight:600;font-family:var(--mono);letter-spacing:-.5px;line-height:1.1}
.summary-label{font-size:11.5px;color:var(--text-mute);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}

/* 表格 */
.table-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}

.site-domain{display:inline-flex;align-items:center;gap:9px;font-weight:500;padding:3px 8px 3px 3px;margin-left:-3px;border-radius:7px;transition:background .13s,color .13s;max-width:100%}
.site-domain:hover{background:var(--accent-bg);color:var(--accent)}
.site-domain .favicon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);transition:transform .13s}
.site-domain:hover .favicon{transform:scale(1.06)}
.site-domain .domain-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-domain .external-icon{opacity:0;transform:translate(-3px,3px);transition:opacity .13s,transform .13s}
.site-domain:hover .external-icon{opacity:.8;transform:translate(0,0)}

.svc-cell{display:flex;align-items:center;gap:9px;font-weight:500;white-space:nowrap}
.svc-icon{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex-shrink:0}

.php-select{appearance:none;padding:5px 26px 5px 10px;font-family:var(--mono);font-size:12.5px;border-radius:6px;border:1px solid var(--border);background-color:var(--bg);color:var(--accent);cursor:pointer;outline:none;min-width:84px;font-weight:500;transition:border-color .12s,box-shadow .12s;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238b95ab' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
.php-select:hover:not(:disabled){border-color:var(--accent)}
.php-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.path-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;border:1px dashed transparent;color:var(--text-dim);font-family:var(--mono);font-size:12px;transition:all .12s;max-width:260px}
.path-btn:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.path-btn .path-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-2);white-space:nowrap}
.chip-accent{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bg)}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--surface-2);color:var(--text-mute)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-err{background:var(--danger-bg);color:var(--danger)}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn.rw-active{color:var(--accent)}
.icon-btn.rw-active:hover{background:var(--accent-bg)}

/* 卡片 */
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;min-width:0}
.version-card{display:flex;flex-direction:column;gap:14px}
.version-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.version-tag{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.5px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;gap:12px}
.kv .k{color:var(--text-mute);flex-shrink:0}
.kv .v{color:var(--text-dim);font-family:var(--mono);font-size:12px;word-break:break-all;text-align:right;max-width:60%}
.version-card-foot{display:flex;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--border-2)}
.version-card-foot .btn{flex:1;min-width:0}

/* 空态 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;border:1px dashed var(--border);border-radius:var(--r);background:var(--surface)}
.empty-icon{font-size:42px;opacity:.55;margin-bottom:16px;line-height:1}
.empty h2{font-size:17px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--text-dim);font-size:13.5px;max-width:460px;margin-bottom:22px;line-height:1.65}

/* ═══════════════════════════════════════════════════════
   任务抽屉（两态：collapsed / expanded）
   ═══════════════════════════════════════════════════════ */
.drawer{
  position:relative;
  border-top:1px solid var(--border);
  background:var(--surface);
  display:flex;flex-direction:column;
  height:42px;                       /* 默认收起，只显示头部 */
  flex-shrink:0;
  transition:height .2s ease;
}
.drawer.expanded{
  height:var(--drawer-height);
}
.drawer-log{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
  font-family:var(--mono);
  font-size:12px;
  line-height:1.7;
  color:var(--text-dim);
  white-space:pre-wrap;
  word-break:break-word;
  margin:0;
  background:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
}
.drawer.expanded .drawer-log{
  opacity:1;
  pointer-events:auto;
}

/* 抽屉上边缘拖拽把手（仅 expanded 可用） */
.drawer-resizer{
  position:absolute;top:-3px;left:0;right:0;height:6px;
  cursor:row-resize;z-index:20;background:transparent;
  transition:background .15s;
}
.drawer.expanded .drawer-resizer:hover,
.drawer.expanded .drawer-resizer.dragging{
  background:var(--accent);opacity:.5;
}

.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:42px;flex-shrink:0;
  border-bottom:1px solid var(--border-2);
  background:var(--surface-2);
  transition:border-color .2s;
}
.drawer:not(.expanded) .drawer-head{border-bottom-color:transparent}

.drawer-left{display:flex;align-items:center;gap:10px;min-width:0}
.drawer-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

.drawer-dot{width:7px;height:7px;border-radius:50%;background:var(--text-mute);flex-shrink:0;transition:background .15s}
.drawer-dot.running{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.drawer-dot.success{background:var(--ok)}
.drawer-dot.failed{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}

.drawer-label{font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.drawer-cmd{color:var(--text-mute);font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.drawer-status{font-size:11.5px;color:var(--text-mute);font-family:var(--mono)}

/* 展开/收起图标旋转 */
.drawer-toggle-icon{transition:transform .2s}
.drawer.expanded .drawer-toggle-icon{transform:rotate(180deg)}

.log-line{color:var(--text-dim)}
.log-line.err{color:var(--danger)}
.log-line.ok{color:var(--ok)}
.log-line.meta{color:var(--accent)}
.log-line.cmd{color:var(--text);font-weight:500}
.log-line.dim{color:var(--text-mute)}

/* 弹窗 */
.modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;padding:20px}
.modal-root.open{display:flex}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;max-height:88vh;box-shadow:var(--shadow);animation:popIn .18s cubic-bezier(.2,.9,.3,1.15);display:flex;flex-direction:column;overflow:hidden}
.modal-lg{max-width:620px}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{padding:20px 22px 6px;flex-shrink:0}
.modal-head h3{font-size:17px;font-weight:600;letter-spacing:-.2px}
.modal-head p{color:var(--text-dim);font-size:13px;margin-top:5px}
.modal-body{padding:14px 22px 4px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:18px 22px 20px;border-top:1px solid var(--border-2);flex-shrink:0}
.modal-resizer{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:10;opacity:.35;transition:opacity .15s}
.modal-resizer:hover{opacity:.9}
.modal-resizer::before,.modal-resizer::after{content:'';position:absolute;background:var(--text-mute);border-radius:1px}
.modal-resizer::before{right:3px;bottom:3px;width:8px;height:1.5px;transform:rotate(-45deg);transform-origin:right bottom}
.modal-resizer::after{right:3px;bottom:7px;width:4px;height:1.5px;transform:rotate(-45deg);transform-origin:right bottom}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:500;color:var(--text-dim)}
.field .hint{font-size:11.5px;color:var(--text-mute);line-height:1.5}

input[type="text"],input[type="number"],select,textarea{width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .13s,box-shadow .13s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.quick-picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{font-family:var(--mono);font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);transition:all .12s}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.pick.selected{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.cmd-preview{background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--text-dim);word-break:break-all;line-height:1.6}
.cmd-preview .prompt{color:var(--accent);user-select:none}

.alert{padding:11px 14px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.6;border:1px solid transparent}
.alert-warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.alert-danger{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger)}
.alert-info{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent)}

/* 危险操作弹窗 */
.danger-header{display:flex;align-items:flex-start;gap:14px;padding:22px 22px 6px;flex-shrink:0}
.danger-icon{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--danger-bg);color:var(--danger);display:grid;place-items:center;font-size:20px}
.danger-header h3{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-top:4px}
.danger-header p{color:var(--text-dim);font-size:13px;margin-top:5px}
.danger-list{list-style:none;padding:12px 14px;background:var(--danger-bg);border-radius:var(--r-sm);font-size:12.5px;line-height:1.7;color:var(--danger);display:flex;flex-direction:column;gap:4px}
.danger-list li::before{content:'⚠  ';font-weight:700;margin-right:4px}
.danger-list li.keep::before{content:'✓  ';color:var(--ok)}
.danger-list li.keep{color:var(--text-dim)}
.danger-input-wrap{display:flex;flex-direction:column;gap:6px}
.danger-input-wrap label{font-size:12.5px;color:var(--text-dim);font-weight:500}
.danger-input-wrap label .key{font-family:var(--mono);background:var(--danger-bg);color:var(--danger);padding:1px 7px;border-radius:4px;font-weight:600;font-size:12px}
.danger-input-wrap input{font-weight:600;letter-spacing:.5px}
.danger-input-wrap input.match{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.danger-check{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all .13s;background:var(--bg)}
.danger-check:hover{border-color:var(--danger)}
.danger-check.checked{background:var(--danger-bg);border-color:var(--danger)}
.danger-check input{width:16px;height:16px;flex-shrink:0;margin-top:3px;accent-color:var(--danger);cursor:pointer}
.danger-check .check-label{font-size:12.5px;line-height:1.55;color:var(--text-dim)}
.danger-check.checked .check-label{color:var(--danger)}

/* 主题选择 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.theme-card{padding:14px;border-radius:var(--r);border:2px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.theme-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.theme-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.theme-card.selected::after{content:'✓';position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.theme-preview{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.theme-swatch{height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.1)}
.theme-swatch-bg{grid-column:span 2;height:32px;border-radius:6px}
.theme-name{font-size:13px;font-weight:600;color:var(--text)}
.theme-desc{font-size:11.5px;color:var(--text-mute);margin-top:2px}

/* 伪静态配置 */
.fw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.fw-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .13s;text-align:center}
.fw-card:hover{border-color:var(--accent);background:var(--accent-bg)}
.fw-card.selected{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent-bg)}
.fw-card .fw-icon{font-size:20px;line-height:1}
.fw-card .fw-name{font-size:12px;font-weight:500;color:var(--text)}
.fw-card.selected .fw-name{color:var(--accent)}
.fw-card .fw-tag{font-size:10px;color:var(--text-mute);font-family:var(--mono)}
.rw-editor{width:100%;min-height:160px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);resize:vertical;outline:none;transition:border-color .13s,box-shadow .13s;tab-size:4}
.rw-editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

/* 扩展 toggle */
.ext-toggle-grid{display:flex;flex-wrap:wrap;gap:6px}
.ext-toggle{font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid transparent;cursor:pointer;transition:all .13s;user-select:none;white-space:nowrap}
.ext-toggle.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.ext-toggle.on:hover{opacity:.85}
.ext-toggle.off{background:var(--surface-2);color:var(--text-mute);border-color:var(--border)}
.ext-toggle.off:hover{border-color:var(--accent);color:var(--text)}

/* 输入 + 内联按钮 */
.input-with-action{display:flex;gap:6px;align-items:stretch}
.input-with-action input{flex:1;min-width:0}
.input-action-btn{display:inline-flex;align-items:center;gap:5px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .13s;white-space:nowrap;flex-shrink:0}
.input-action-btn:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.input-action-btn svg{opacity:.8;flex-shrink:0}

/* 布局设置滑块 */
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--surface-3);outline:none;cursor:pointer}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:grab;box-shadow:0 0 0 3px var(--accent-bg);transition:transform .12s}
.slider-row input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider-row input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:none;cursor:grab;box-shadow:0 0 0 3px var(--accent-bg)}
.slider-value{font-family:var(--mono);font-size:12px;color:var(--text-dim);min-width:56px;text-align:right}

/* Toast */
.toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 16px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .2s ease-out;pointer-events:auto;max-width:380px;white-space:pre-line;word-break:break-word}
.toast.ok{border-left:3px solid var(--ok)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}

/* 命令面板 */
.cmd-palette{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:15vh;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:150}
.cmd-palette.open{display:flex}
.cmd-palette-box{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:popIn .16s ease-out;margin:0 20px}
.cmd-palette-box input{width:100%;padding:16px 20px;font-size:15px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--sans);outline:none}
.cmd-palette-list{max-height:320px;overflow-y:auto;padding:8px}
.cmd-palette-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13.5px;cursor:pointer}
.cmd-palette-item:hover,.cmd-palette-item.active{background:var(--accent-bg);color:var(--accent)}
.cmd-palette-item .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--text-mute)}

/* 响应式 */
@media (max-width:1280px){
  :root{--content-max:100%;--content-pad-x:24px}
  .view-inner{padding:24px var(--content-pad-x) 40px}
  .view-header h1{font-size:22px}
  .summary{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .summary-item{padding:14px}
  .summary-num{font-size:20px}
}
@media (max-width:960px){
  :root{--sidebar-width:64px;--content-pad-x:20px}
  .brand{justify-content:center;padding:8px 0 18px}
  .brand-meta{display:none}
  .nav-section{display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item > span:not(.nav-icon){display:none}
  .nav-item.active::before{display:none}
  .nav-badge{display:none}
  .btn-ghost > span{display:none}
  .btn-ghost{justify-content:center}
  .view-header{flex-direction:column;align-items:stretch;gap:12px}
  .header-actions{justify-content:flex-end}
  .drawer-cmd{display:none}
}
@media (min-width:1600px){
  :root{--content-max:1400px;--content-pad-x:48px}
  body{font-size:14.5px}
  .view-header h1{font-size:26px}
  .summary-num{font-size:24px}
}
@media (min-width:2200px){
  :root{--content-max:1680px;--content-pad-x:60px}
  body{font-size:15px}
}
@media (max-height:720px){
  .view-inner{padding-top:20px;padding-bottom:30px}
  .view-header{margin-bottom:18px}
  .view-header h1{font-size:20px}
  .summary-item{padding:12px 14px}
  .summary-num{font-size:18px}
  :root{--drawer-height:180px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">π</div>
      <div class="brand-meta">
        <div class="brand-name">phpbox</div>
        <div class="brand-status"><span class="dot dot-ok"></span><span id="brand-connected">引擎已连接</span></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn-ghost" id="cmd-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span data-foot="palette">命令面板</span>
      </button>
      <button class="btn-ghost" id="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        <span data-foot="sync">同步状态</span>
      </button>
      <button class="btn-ghost" id="theme-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-foot="theme">切换主题</span>
      </button>
    </div>
    <div class="sidebar-resizer" id="sidebar-resizer" title="拖拽调整宽度（双击重置）"></div>
  </aside>

  <main class="main">
    <div class="view" id="view"></div>

    <!-- 任务抽屉：默认收起，点击展开/收起 -->
    <section class="drawer" id="drawer">
      <div class="drawer-resizer" id="drawer-resizer" title="拖拽调整高度（仅展开时可用）"></div>
      <header class="drawer-head">
        <div class="drawer-left">
          <span class="drawer-dot" id="drawer-dot"></span>
          <span class="drawer-label" id="drawer-label">任务日志</span>
          <span class="drawer-cmd" id="drawer-cmd">暂无任务</span>
        </div>
        <div class="drawer-right">
          <span class="drawer-status" id="drawer-status"></span>
          <button class="icon-btn" id="drawer-copy" title="复制日志">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
          <button class="icon-btn" id="drawer-toggle" title="展开 / 收起">
            <svg class="drawer-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 15l-6-6-6 6"/>
            </svg>
          </button>
        </div>
      </header>
      <pre class="drawer-log" id="drawer-log"></pre>
    </section>
  </main>
</div>

<div class="modal-root" id="modal-root" role="dialog" aria-modal="true" aria-label="phpbox 对话框"></div>

<div class="cmd-palette" id="cmd-palette">
  <div class="cmd-palette-box">
    <input type="text" id="cmd-input" placeholder="输入命令或搜索页面…" autocomplete="off">
    <div class="cmd-palette-list" id="cmd-list"></div>
  </div>
</div>

<div class="toast-root" id="toast-root"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   布局管理（可拖拽 + 持久化）
   ═══════════════════════════════════════════════════════ */
const LAYOUT_LIMITS = {
  sidebar: { min: 64,  max: 380, default: 200 },
  drawer:  { min: 120, max: 600, default: 160 },
};

const LAYOUT_PRESETS = {
  compact: { sidebar: 200, drawer: 160, label: { 'zh-CN': '紧凑', 'en-US': 'Compact' }, desc: '小屏笔记本' },
  default: { sidebar: 232, drawer: 220, label: { 'zh-CN': '标准', 'en-US': 'Standard' }, desc: '默认' },
  wide:    { sidebar: 280, drawer: 320, label: { 'zh-CN': '宽屏', 'en-US': 'Wide' }, desc: '大显示器' },
};

const layout = {
  sidebarWidth: LAYOUT_PRESETS.compact.sidebar,
  drawerHeight: LAYOUT_PRESETS.compact.drawer,

  load() {
    let s = null, d = null;
    try {
      s = localStorage.getItem('phpbox-sidebar-width');
      d = localStorage.getItem('phpbox-drawer-height');
    } catch {}
    this.sidebarWidth = s == null ? LAYOUT_PRESETS.compact.sidebar
      : clamp(parseInt(s, 10), LAYOUT_LIMITS.sidebar.min, LAYOUT_LIMITS.sidebar.max);
    this.drawerHeight = d == null ? LAYOUT_PRESETS.compact.drawer
      : clamp(parseInt(d, 10), LAYOUT_LIMITS.drawer.min, LAYOUT_LIMITS.drawer.max);
    this.apply();
  },

  save() {
    try {
      localStorage.setItem('phpbox-sidebar-width', this.sidebarWidth);
      localStorage.setItem('phpbox-drawer-height', this.drawerHeight);
    } catch {}
  },

  apply() {
    document.documentElement.style.setProperty('--sidebar-width', this.sidebarWidth + 'px');
    document.documentElement.style.setProperty('--drawer-height', this.drawerHeight + 'px');
  },

  setSidebar(w) {
    this.sidebarWidth = clamp(w, LAYOUT_LIMITS.sidebar.min, LAYOUT_LIMITS.sidebar.max);
    this.apply(); this.save(); markActivePreset();
  },

  setDrawer(h) {
    this.drawerHeight = clamp(h, LAYOUT_LIMITS.drawer.min, LAYOUT_LIMITS.drawer.max);
    this.apply(); this.save(); markActivePreset();
  },

  reset() {
    this.sidebarWidth = LAYOUT_PRESETS.compact.sidebar;
    this.drawerHeight = LAYOUT_PRESETS.compact.drawer;
    this.apply(); this.save(); markActivePreset();
  },

  applyPreset(name) {
    const p = LAYOUT_PRESETS[name];
    if (!p) return;
    this.sidebarWidth = p.sidebar;
    this.drawerHeight = p.drawer;
    this.apply(); this.save(); markActivePreset();
  },
};

function clamp(v, min, max) {
  if (isNaN(v)) return min;
  return Math.min(Math.max(v, min), max);
}

function markActivePreset() {
  const btns = $$('.layout-preset-btn');
  btns.forEach(b => b.classList.remove('selected'));
  for (const [name, p] of Object.entries(LAYOUT_PRESETS)) {
    if (p.sidebar === layout.sidebarWidth && p.drawer === layout.drawerHeight) {
      const b = document.querySelector(`.layout-preset-btn[data-preset="${name}"]`);
      if (b) b.classList.add('selected');
      break;
    }
  }
}

/* 拖拽逻辑 */
function setupSidebarResize() {
  const app = $('#app');
  const resizer = $('#sidebar-resizer');
  if (!resizer) return;
  let startX = 0, startW = 0, dragging = false;

  function onDown(e) {
    if (window.innerWidth <= 960) return;
    dragging = true;
    startX = e.clientX != null ? e.clientX : e.touches[0].clientX;
    startW = layout.sidebarWidth;
    app.classList.add('resizing');
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const x = e.clientX != null ? e.clientX : e.touches[0].clientX;
    layout.setSidebar(startW + (x - startX));
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    app.classList.remove('resizing');
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
  resizer.addEventListener('dblclick', () => layout.setSidebar(LAYOUT_LIMITS.sidebar.default));
}

function setupDrawerResize() {
  const drawer = $('#drawer');
  const resizer = $('#drawer-resizer');
  if (!resizer) return;
  let startY = 0, startH = 0, dragging = false;

  function onDown(e) {
    if (!drawer.classList.contains('expanded')) return;
    dragging = true;
    startY = e.clientY != null ? e.clientY : e.touches[0].clientY;
    startH = drawer.offsetHeight;
    drawer.style.transition = 'none';
    resizer.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const y = e.clientY != null ? e.clientY : e.touches[0].clientY;
    const delta = startY - y;
    layout.setDrawer(startH + delta);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    drawer.style.transition = '';
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
  resizer.addEventListener('dblclick', () => layout.setDrawer(LAYOUT_LIMITS.drawer.default));
}

function setupModalResize(modal) {
  if (!modal) return;
  const resizer = modal.querySelector('.modal-resizer');
  if (!resizer) return;
  let startX = 0, startY = 0, startW = 0, startH = 0, dragging = false;

  function onDown(e) {
    dragging = true;
    startX = e.clientX != null ? e.clientX : e.touches[0].clientX;
    startY = e.clientY != null ? e.clientY : e.touches[0].clientY;
    startW = modal.offsetWidth;
    startH = modal.offsetHeight;
    modal.style.width = startW + 'px';
    modal.style.height = startH + 'px';
    modal.style.maxWidth = 'none';
    modal.style.maxHeight = 'none';
    document.body.style.cursor = 'nwse-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault(); e.stopPropagation();
  }
  function onMove(e) {
    if (!dragging) return;
    const x = e.clientX != null ? e.clientX : e.touches[0].clientX;
    const y = e.clientY != null ? e.clientY : e.touches[0].clientY;
    modal.style.width = clamp(startW + (x - startX), 360, window.innerWidth - 60) + 'px';
    modal.style.height = clamp(startH + (y - startY), 240, window.innerHeight - 60) + 'px';
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
}

const $ = (s,r=document) => r.querySelector(s);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind='info', ttl=3200) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => {
    el.style.transition='opacity .2s,transform .2s';

    setTimeout(() => el.remove(), 220);
  }, ttl);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}
function siteUrl(d) {
  if (!d) return '';
  if (/:\d+$/.test(d)) return `http://${d}`;
  const p = String(state.env.NGINX_PORT || '80');
  return `http://${d}${p && p !== '80' && p !== '443' ? ':' + p : ''}`;
}
function cmpVer(a,b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i=0; i<Math.max(pa.length,pb.length); i++) {
    const x = pa[i]||0, y = pb[i]||0;
    if (x !== y) return y - x;
  }
  return 0;
}

/* ═══════════════════════════════════════════════════════
   危险操作二次确认
   ═══════════════════════════════════════════════════════ */
function openDangerConfirm(opts) {
  const root = $('#modal-root');
  root.dataset.danger = '1';
  const { title, description, warnings=[], cliPreview, confirmLabel='确认',
          confirmInput, checkbox, onConfirm } = opts;
  let inputMatched = !confirmInput, checked = !checkbox;

  const warningList = warnings.length ? `
    <ul class="danger-list">
      ${warnings.map(w => {
        const text = typeof w === 'string' ? w : w.text;
        const keep = typeof w === 'object' && w.keep;
        return `<li class="${keep ? 'keep' : ''}">${esc(text)}</li>`;
      }).join('')}
    </ul>` : '';

  const inputBlock = confirmInput ? `
    <div class="danger-input-wrap">
      <label>${confirmInput.label} <span class="key">${esc(confirmInput.expect)}</span></label>
      <input type="text" id="dc-input" autocomplete="off" spellcheck="false"
             placeholder="${esc(confirmInput.placeholder || '')}">
    </div>` : '';

  const checkboxBlock = checkbox ? `
    <label class="danger-check" id="dc-check-wrap">
      <input type="checkbox" id="dc-check">
      <span class="check-label">${esc(checkbox.label)}</span>
    </label>` : '';

  const cliBlock = cliPreview ? `
    <div class="field">
      <label>将执行</label>
      <div class="cmd-preview"><span class="prompt">$ </span>${esc(cliPreview)}</div>
    </div>` : '';

  root.innerHTML = `
    <div class="modal">
      <div class="danger-header">
        <div class="danger-icon">⚠</div>
        <div style="flex:1"><h3>${esc(title)}</h3>${description ? `<p>${esc(description)}</p>` : ''}</div>
      </div>
      <div class="modal-body">${warningList}${inputBlock}${checkboxBlock}${cliBlock}</div>
      <div class="modal-foot">
        <button class="btn" data-modal-close>取消</button>
        <button class="btn btn-danger" id="dc-ok" disabled
                style="background:var(--danger-bg);border-color:var(--danger-bg)">${esc(confirmLabel)}</button>
      </div>
      <div class="modal-resizer" title="拖拽调整大小"></div>
    </div>`;

  root.classList.add('open');
  setupModalResize($('.modal', root));

  const okBtn = $('#dc-ok');
  const inputEl = confirmInput ? $('#dc-input') : null;
  const checkEl = checkbox ? $('#dc-check') : null;
  const checkWrap = checkbox ? $('#dc-check-wrap') : null;

  function refresh() { okBtn.disabled = !(inputMatched && checked); }
  if (inputEl) {
    inputEl.addEventListener('input', () => {
      const v = inputEl.value.trim();
      const ok = v === confirmInput.expect;
      inputMatched = ok;
      inputEl.classList.toggle('match', ok);
      refresh();
    });
    setTimeout(() => inputEl.focus(), 80);
  }
  if (checkEl) {
    checkEl.addEventListener('change', () => {
      checked = checkEl.checked;
      checkWrap.classList.toggle('checked', checked);
      refresh();
    });
  }
  refresh();
  root.onkeydown = e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && !okBtn.disabled && !inputEl) { e.preventDefault(); okBtn.click(); }
  };
  okBtn.addEventListener('click', () => { closeModal(); onConfirm && onConfirm(); });
}

function closeModal() {
  const root = $('#modal-root');
  root.classList.remove('open');
  root.innerHTML = '';
  root.onkeydown = null;
  delete root.dataset.danger;
}

/* 伪静态配置弹窗 */
function openRewriteModal(domain) {
  const site = state.sites.find(s => s.domain === domain);
  if (!site) return;
  const root = $('#modal-root');

  let selected = site.rewrite || 'none';
  let currentRule = REWRITE_PRESETS[selected]?.rule || REWRITE_PRESETS.custom.rule;

  function buildFwGrid() {
    return Object.entries(REWRITE_PRESETS).map(([key, p]) => `
      <div class="fw-card ${key === selected ? 'selected' : ''}" data-fw="${key}">
        <div class="fw-icon">${p.icon}</div>
        <div class="fw-name">${esc(p.name)}</div>
        <div class="fw-tag">${esc(p.tag)}</div>
      </div>`).join('');
  }

  function refreshGrid() {
    $('#fw-grid', root).innerHTML = buildFwGrid();
    $$('.fw-card', root).forEach(el => {
      el.addEventListener('click', () => {
        selected = el.dataset.fw;
        currentRule = REWRITE_PRESETS[selected].rule;
        $('#rw-editor', root).value = currentRule;
        refreshGrid();
        updateDirtyState();
      });
    });
  }

  function updateDirtyState() {
    const btn = $('#rw-apply', root);
    const editorVal = $('#rw-editor', root).value;
    const dirty = selected !== site.rewrite || editorVal !== (REWRITE_PRESETS[selected]?.rule || '');
    btn.disabled = !dirty;
    btn.textContent = dirty ? '应用并重载' : '当前配置';
  }

  root.innerHTML = `
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3>${esc(domain)} · 伪静态配置</h3>
        <p>选择框架自动填充规则，也可手动编辑 · 应用后自动校验并重载 Nginx</p>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>选择框架</label>
          <div class="fw-grid" id="fw-grid"></div>
        </div>
        <div class="field">
          <label>规则内容
            <span style="font-weight:400;color:var(--text-mute);font-size:11.5px">· 选择框架后自动填充，可自由编辑</span>
          </label>
          <textarea class="rw-editor" id="rw-editor" spellcheck="false"></textarea>
          <div class="hint">写入位置：<span class="mono">config/nginx/sites/${esc(domain)}.conf</span> 的 server 块内</div>
        </div>
        <div class="alert alert-info">
          <strong>应用流程：</strong>生成 vhost → <span class="mono">nginx -t</span> 校验 → reload Nginx → 失败自动恢复旧配置。
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-modal-close>取消</button>
        <button class="btn btn-primary" id="rw-apply">应用并重载</button>
      </div>
      <div class="modal-resizer" title="拖拽调整大小"></div>
    </div>`;

  root.classList.add('open');
  setupModalResize($('.modal', root));

  $('#rw-editor', root).value = currentRule;
  refreshGrid();
  updateDirtyState();

  $('#rw-editor', root).addEventListener('input', e => {
    currentRule = e.target.value;
    updateDirtyState();
  });
  $('#rw-editor', root).addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + '    ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      currentRule = ta.value;
      updateDirtyState();
    }
  });

  root.onkeydown = e => { if (e.key === 'Escape') closeModal(); };

  $('#rw-apply', root).addEventListener('click', () => {
    const finalRule = $('#rw-editor', root).value;
    const preset = REWRITE_PRESETS[selected];
    closeModal();
    site.rewrite = selected;
    render();
    runTask(['site','rewrite',domain,'--preset',selected],
            `配置 ${domain} 伪静态（${preset.name}）`,
            { type:'rewrite', domain, preset:selected, rule:finalRule });
  });
}

function versionCard(kind, version) {
  const portMap = {
    mysql:{'8.4':'3384','8.0':'3380','5.7':'3357','9.1':'3391'},
    pgsql:{'17':'5417','16':'5416','15':'5415','14':'5414'},
    redis:{'8':'6379','7':'6377'},
    nginx:{'alpine':'80','1.25':'8025'},
  };
  const port = (portMap[kind]||{})[version] || '';
  const extras = [];
  if (port) extras.push(`<div class="kv"><span class="k">端口</span><span class="v">${esc(port)}</span></div>`);
  if (kind === 'php') extras.push(`<div class="kv"><span class="k">扩展</span><span class="v">${(state.phpExtensions[version]||[]).length} 个</span></div>`);
  if (kind === 'mysql' || kind === 'pgsql') extras.push(`<div class="kv"><span class="k">密码</span><span class="v">••••••••</span></div>`);
  extras.push(`<div class="kv"><span class="k">配置</span><span class="v">config/${kind}/${version}/</span></div>`);

  const primaryBtn = kind === 'php'
    ? `<button class="btn btn-sm btn-primary" data-action="php-extensions" data-version="${esc(version)}">管理扩展</button>`
    : `<button class="btn btn-sm" data-action="copy-cmd" data-cmd="phpbox ${kind} list">命令</button>`;

  return `<article class="card version-card">
    <div class="version-card-head">
      <span class="version-tag">${esc(version)}</span>
      <span class="status-pill pill-ok"><span class="pill-dot"></span>运行中</span>
    </div>
    <div>${extras.join('')}</div>
    <div class="version-card-foot">
      ${primaryBtn}
      <button class="btn btn-sm btn-danger" data-action="uninstall" data-kind="${kind}" data-version="${esc(version)}">卸载</button>
    </div>
  </article>`;
}

/* 设置页布局控件 */
function setupLayoutControls() {
  const sidebarRange = $('#setting-sidebar-width');
  const drawerRange  = $('#setting-drawer-height');
  if (!sidebarRange || !drawerRange) return;
  const sidebarVal = $('#sidebar-width-val');
  const drawerVal  = $('#drawer-height-val');

  sidebarRange.addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    sidebarVal.textContent = v + 'px';
    layout.setSidebar(v);
  });
  drawerRange.addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    drawerVal.textContent = v + 'px';
    layout.setDrawer(v);
  });

  $$('.layout-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.preset;
      layout.applyPreset(name);
      sidebarRange.value = layout.sidebarWidth;
      drawerRange.value = layout.drawerHeight;
      sidebarVal.textContent = layout.sidebarWidth + 'px';
      drawerVal.textContent = layout.drawerHeight + 'px';
      toast(`已切换到「${LAYOUT_PRESETS[name].label}」布局`, 'ok', 1400);
    });
  });

  const resetBtn = $('#layout-reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      layout.reset();
      sidebarRange.value = layout.sidebarWidth;
      drawerRange.value = layout.drawerHeight;
      sidebarVal.textContent = layout.sidebarWidth + 'px';
      drawerVal.textContent = layout.drawerHeight + 'px';
      toast('布局已重置为紧凑模式', 'ok', 1400);
    });
  }

  markActivePreset();
}

/* 文件夹选择 */
async function pickFolder(targetKey) {
  if (window.showDirectoryPicker) {
    try {
      const handle = await window.showDirectoryPicker({ id: 'phpbox-' + targetKey, mode: 'readwrite' });
      const name = handle.name;
      const fakePath = `~/${name}`;
      const input = $(`input[data-env-key="${targetKey}"]`);
      if (input) {
        input.value = fakePath;
        input.style.transition = 'border-color .2s';
        input.style.borderColor = 'var(--accent)';
        setTimeout(() => { input.style.borderColor = ''; }, 800);
      }
      toast(`✓ 已选择文件夹：${name}\n\n浏览器出于安全限制只返回目录名。\n桌面版会返回完整路径。`, 'ok', 4200);
      return;
    } catch (err) { if (err && err.name === 'AbortError') return; }
  }

  const fallback = document.createElement('input');
  fallback.type = 'file';
  fallback.webkitdirectory = true;
  fallback.style.position = 'fixed';
  fallback.style.opacity = '0';
  fallback.style.pointerEvents = 'none';
  document.body.appendChild(fallback);

  fallback.addEventListener('change', () => {
    const files = fallback.files;
    fallback.remove();
    if (!files || files.length === 0) return;
    const rel = files[0].webkitRelativePath || '';
    const rootName = rel.split('/')[0] || 'selected-folder';
    const fakePath = `~/${rootName}`;
    const input = $(`input[data-env-key="${targetKey}"]`);
    if (input) {
      input.value = fakePath;
      input.style.transition = 'border-color .2s';
      input.style.borderColor = 'var(--accent)';
      setTimeout(() => { input.style.borderColor = ''; }, 800);
    }
    toast(`✓ 已选择文件夹：${rootName}\n\n浏览器出于安全限制只返回目录名。\n桌面版会返回完整路径。`, 'ok', 4200);
  });
  fallback.click();
}

function saveSettings() {
  const inputs = $$('input[data-env-key]');
  if (!inputs.length) return;
  const changes = [];
  inputs.forEach(input => {
    const key = input.dataset.envKey;
    const newVal = input.value.trim();
    const oldVal = state.env[key];
    if (newVal !== oldVal) {
      changes.push({ key, old: oldVal, new: newVal });
      state.env[key] = newVal;
    }
  });
  if (changes.length === 0) { toast('没有改动', 'info', 1400); return; }
  const needRestart = changes.filter(c => ['WWW_ROOT','MYSQL_DATA_ROOT','PGSQL_DATA_ROOT'].includes(c.key));
  const msg = changes.map(c => `${c.key}\n  ${c.old}  →  ${c.new}`).join('\n\n');
  if (needRestart.length) {
    toast(`✓ 已保存 ${changes.length} 项到 .env\n\n${msg}\n\n⚠ ${needRestart.length} 项需重装对应服务才能生效`, 'ok', 5200);
  } else {
    toast(`✓ 已保存 ${changes.length} 项到 .env\n\n${msg}`, 'ok', 3600);
  }
}

/* PHP 扩展管理 */
const EXT_LIB = ['apcu','memcached','mongodb','amqp','yaml','ssh2','swoole','event','grpc','protobuf','igbinary','msgpack','ds','uv','pthreads'];

const EXT_PRESETS = {
  default: ['gd','redis','pdo_mysql','mysqli','pgsql','pdo_pgsql','zip','bcmath','intl','opcache','exif','soap','sockets','imagick'],
  minimal: ['opcache'],
  web:     ['gd','redis','pdo_mysql','mysqli','pgsql','pdo_pgsql','zip','bcmath','intl','opcache','exif','soap','sockets','imagick'],
  debug:   ['gd','redis','pdo_mysql','mysqli','pgsql','pdo_pgsql','zip','bcmath','intl','opcache','exif','soap','sockets','imagick','xdebug'],
};

function openPhpExtensionsModal(version) {
  const root = $('#modal-root');
  const installedExts = [...(state.phpExtensions[version] || [])];
  let extraExts = [];
  let selected = new Set(EXT_PRESETS.debug);
  let currentPreset = 'debug';

  function getSuggestions() {
    return EXT_LIB.filter(e => !installedExts.includes(e) && !extraExts.includes(e)).slice(0, 12);
  }

  function buildBody() {
    const enabledList = [...installedExts, ...extraExts];
    const suggestions = getSuggestions();

    const enabledHtml = enabledList.length
      ? enabledList.map(e => {
          const on = selected.has(e);
          return `<button class="ext-toggle ${on ? 'on' : 'off'}" data-ext="${esc(e)}">${esc(e)}</button>`;
        }).join('')
      : '<span style="color:var(--text-mute);font-size:12.5px">暂无已安装扩展</span>';

    const suggestHtml = suggestions.length
      ? suggestions.map(e => {
          const on = selected.has(e);
          return `<button class="ext-toggle ${on ? 'on' : 'off'}" data-ext="${esc(e)}">${esc(e)}</button>`;
        }).join('')
      : '<span style="color:var(--text-mute);font-size:12.5px">暂无更多推荐</span>';

    const enabledOnCount = enabledList.filter(e => selected.has(e)).length;
    const suggestOnCount = suggestions.filter(e => selected.has(e)).length;

    return `
      <div class="field">
        <label>预设档案</label>
        <div class="quick-picks" id="ext-presets">
          <button class="pick ${currentPreset==='default'?'selected':''}" data-preset="default">默认集</button>
          <button class="pick ${currentPreset==='minimal'?'selected':''}" data-preset="minimal">minimal</button>
          <button class="pick ${currentPreset==='web'?'selected':''}"     data-preset="web">web</button>
          <button class="pick ${currentPreset==='debug'?'selected':''}"   data-preset="debug">debug</button>
        </div>
        <div class="hint">选择预设会把下方所有扩展切换为该组合的状态。</div>
      </div>
      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label>已启用扩展</label>
          <span class="mono" style="font-size:11.5px;color:var(--text-mute)">${enabledOnCount} / ${enabledList.length} 已选</span>
        </div>
        <div class="ext-toggle-grid" id="ext-enabled">${enabledHtml}</div>
        <div class="hint">点击切换启用/停用，标签会保留在列表中。</div>
      </div>
      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label>常用可添加</label>
          <span class="mono" style="font-size:11.5px;color:var(--text-mute)">${suggestOnCount} / ${suggestions.length} 已选</span>
        </div>
        <div class="ext-toggle-grid" id="ext-suggestions">${suggestHtml}</div>
        <div class="hint">点击切换选中，选中的会一并写入。</div>
      </div>
      <div class="field">
        <label>添加扩展</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="ext-add-input" placeholder="输入扩展名，例如 swoole" autocomplete="off">
          <button class="btn btn-primary" id="ext-add-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            添加
          </button>
        </div>
        <div class="hint">扩展名白名单 <span class="mono">^[a-zA-Z0-9._-]+$</span>。添加后进入"已启用扩展"。</div>
      </div>
      <div class="alert alert-warn">
        <strong>应用后流程：</strong>写 extensions.env → 重建镜像 → 重建容器 → <span class="mono">nginx -t</span> → reload。
      </div>`;
  }

  function isDirty() {
    const finalSet = new Set(selected);
    const originalSet = new Set(installedExts);
    if (finalSet.size !== originalSet.size) return true;
    for (const e of finalSet) if (!originalSet.has(e)) return true;
    return false;
  }

  function refresh() {
    $('#ext-body', root).innerHTML = buildBody();
    bindEvents();
    const btn = $('#ext-apply', root);
    const dirty = isDirty();
    btn.disabled = !dirty;
    btn.textContent = dirty ? `应用并重建（已选 ${selected.size} 个扩展）` : '当前配置';
  }

  function bindEvents() {
    $$('#ext-presets .pick', root).forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.preset;
        currentPreset = p;
        selected = new Set(EXT_PRESETS[p]);
        refresh();
      });
    });
    $$('#ext-enabled .ext-toggle', root).forEach(btn => {
      btn.addEventListener('click', () => {
        const e = btn.dataset.ext;
        if (selected.has(e)) selected.delete(e); else selected.add(e);
        currentPreset = null;
        refresh();
      });
    });
    $$('#ext-suggestions .ext-toggle', root).forEach(btn => {
      btn.addEventListener('click', () => {
        const e = btn.dataset.ext;
        if (selected.has(e)) selected.delete(e); else selected.add(e);
        currentPreset = null;
        refresh();
      });
    });
    const input = $('#ext-add-input', root);
    const addBtn = $('#ext-add-btn', root);
    function doAdd() {
      const name = input.value.trim();
      if (!name) return;
      if (!/^[a-zA-Z0-9._-]+$/.test(name)) { toast('扩展名格式不正确', 'err'); return; }
      if (installedExts.includes(name) || extraExts.includes(name)) {
        toast(`扩展 ${name} 已在列表中`, 'info', 1600); input.value = ''; return;
      }
      extraExts.push(name);
      selected.add(name);
      input.value = '';
      currentPreset = null;
      refresh();
      setTimeout(() => $('#ext-add-input', root)?.focus(), 30);
    }
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
  }

  root.innerHTML = `
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3>PHP ${esc(version)} · 扩展管理</h3>
        <p>启用、停用或添加扩展 · 应用后自动重建镜像并重载 Nginx</p>
      </div>
      <div class="modal-body" id="ext-body"></div>
      <div class="modal-foot">
        <button class="btn" data-modal-close>取消</button>
        <button class="btn btn-primary" id="ext-apply">应用并重建</button>
      </div>
      <div class="modal-resizer" title="拖拽调整大小"></div>
    </div>`;
  root.classList.add('open');
  setupModalResize($('.modal', root));
  refresh();
  setTimeout(() => $('#ext-add-input', root)?.focus(), 80);
  root.onkeydown = e => { if (e.key === 'Escape') closeModal(); };

  $('#ext-apply', root).addEventListener('click', () => {
    if (!isDirty()) { closeModal(); return; }
    const finalExts = [...selected];
    const original = [...installedExts];
    const added = finalExts.filter(x => !original.includes(x));
    const removed = original.filter(x => !finalExts.includes(x));
    state.phpExtensions[version] = finalExts;
    closeModal();
    render();
    const parts = [];
    if (added.length) parts.push(`+${added.join(',')}`);
    if (removed.length) parts.push(`-${removed.join(',')}`);
    runTask(['php','extension','sync',version,'--ext',finalExts.join(',')],
            `PHP ${version} 扩展变更（${parts.join(' ') || '无变更'}）`,
            { type:'extensions', version, added, removed });
  });
}

function downloadBackup(file) {
  const now = new Date().toLocaleString('zh-CN');
  const content = [
    `# phpbox 备份归档（演示文件）`,
    `# 归档名：${file}`,
    `# 生成时间：${now}`,
    `#`,
    `# 恢复命令：phpbox restore backups/${file}`,
  ].join('\n');
  const blob = new Blob([content], { type:'application/gzip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`✓ 已下载到本地：${file}`, 'ok', 3600);
}

function runTask(args, label, meta) {
  if (state.taskTimer) clearTimeout(state.taskTimer);
  state.task = {
    args, label: label || args.join(' '),
    lines: buildScript(args, meta),
    status:'running', cursor:0, startedAt:Date.now(),
  };

  const drawer = $('#drawer');
  // 更新头部信息
  $('#drawer-label').textContent = state.task.label;
  $('#drawer-cmd').textContent = 'phpbox ' + args.join(' ');
  $('#drawer-dot').className = 'drawer-dot running';
  $('#drawer-status').textContent = '运行中…';
  $('#drawer-log').innerHTML = '';

  // 任务启动时自动展开（让用户看到进度）
  drawer.classList.add('expanded');

  playTask(meta);
}

function playTask(meta) {
  const t = state.task;
  const log = $('#drawer-log');

  function next() {
    if (!state.task || state.task !== t) return;
    if (t.cursor >= t.lines.length) {
      t.status = 'success';
      $('#drawer-dot').className = 'drawer-dot success';
      const dur = Date.now() - t.startedAt;
      $('#drawer-status').textContent = `完成 · ${(dur/1000).toFixed(1)}s`;
      applyStateChange(meta);
      return;
    }
    const entry = t.lines[t.cursor++];
    const div = document.createElement('div');
    let cls = 'log-line';
    if (entry.t === 'err')  cls += ' err';
    if (entry.t === 'ok')   cls += ' ok';
    if (entry.t === 'cmd')  cls += ' cmd';
    if (entry.t === 'meta') cls += ' meta';
    if (entry.t === 'dim')  cls += ' dim';
    div.className = cls;
    div.textContent = entry.s || ' ';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    state.taskTimer = setTimeout(next, entry.t === 'cmd' ? 120 : 90 + Math.random()*200);
  }
  next();
}

function applyStateChange(meta) {
  if (!meta) return;
  if (meta.type === 'install') {
    if (meta.kind === 'nginx') state.installed.nginx = [meta.version];
    else if (!state.installed[meta.kind].includes(meta.version)) {
      state.installed[meta.kind].push(meta.version);
      state.installed[meta.kind].sort(cmpVer);
      if (meta.kind === 'php') {
        state.phpExtensions[meta.version] = ['gd','redis','pdo_mysql','mysqli','pgsql','pdo_pgsql','zip','bcmath','intl','opcache','exif','soap','sockets','imagick','xdebug'];
      }
    }
  } else if (meta.type === 'uninstall') {
    state.installed[meta.kind] = state.installed[meta.kind].filter(v => v !== meta.version);
  } else if (meta.type === 'site-add') {
    if (!state.sites.find(s => s.domain === meta.domain)) {
      state.sites.push({
        domain: meta.domain, php: meta.php,
        root: `${state.env.WWW_ROOT}/${meta.domain.replace(/\.test$/, '')}`,
        hosts: false, health: 'warn', rewrite: meta.rewrite,
      });
    }
  } else if (meta.type === 'site-remove') {
    state.sites = state.sites.filter(s => s.domain !== meta.domain);
  } else if (meta.type === 'offline-prune') {
    state.offline.trees = state.offline.trees.filter(
      t => !(t.svc === meta.svc && t.ver === meta.ver)
    );
  }
  setTimeout(() => { render(); toast('界面已更新', 'ok', 1400); }, 320);
}

function bindEvents() {
  // 侧边导航
  $('#nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-route]');
    if (!btn) return;
    state.route = btn.dataset.route;
    render();
    $('#view').scrollTop = 0;
  });

  // 主视图委托
  $('#view').addEventListener('click', e => {
    if (e.target.closest('.site-domain')) return;
    const jump = e.target.closest('[data-route-jump]');
    if (jump) { state.route = jump.dataset.routeJump; render(); $('#view').scrollTop = 0; return; }

    const folderBtn = e.target.closest('[data-action="pick-folder"]');
    if (folderBtn) { e.preventDefault(); e.stopPropagation(); pickFolder(folderBtn.dataset.target); return; }

    if (e.target.closest('#settings-save')) { saveSettings(); return; }

    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, kind, version, cmd, domain, path, file, svc, ver, size, args, label } = btn.dataset;

    switch (action) {
      case 'install':         openInstallModal(kind); break;
      case 'uninstall':       openUninstallModal(kind, version); break;
      case 'site-add':        openSiteAddModal(); break;
      case 'site-remove':     openSiteRemoveModal(domain); break;
      case 'restore':         openRestoreModal(file); break;
      case 'delete-backup':   openDeleteBackupModal(file); break;
      case 'download-backup': downloadBackup(file); break;
      case 'offline-prune':   openOfflinePruneModal(svc, ver, size); break;
      case 'php-extensions':  openPhpExtensionsModal(version); break;
      case 'rewrite-config':  openRewriteModal(domain); break;
      case 'hosts-add':
        toast(`已添加 hosts：127.0.0.1  ${domain}`, 'ok');
        state.sites.find(s => s.domain === domain).hosts = true;
        render();
        break;
      case 'open-path':
        copyText(path).then(ok => toast(
          ok ? `路径已复制：${path}\n\n桌面版会直接打开文件管理器` : `路径：${path}`,
          ok ? 'ok' : 'info', 3200
        ));
        break;
      case 'copy-cmd':
        copyText(cmd).then(ok => toast(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'err', 1600));
        break;
      case 'run-task': {
        const list = args.split(',').filter(Boolean);
        runTask(list, label || list.join(' '));
        break;
      }
    }
  });

  // PHP 版本切换
  $('#view').addEventListener('change', e => {
    const sel = e.target.closest('.php-select');
    if (!sel) return;
    const domain = sel.dataset.domain;
    const newV = sel.value;
    const site = state.sites.find(s => s.domain === domain);
    if (!site || site.php === newV) return;
    sel.disabled = true;
    if (sel.selectedIndex >= 0) sel.options[sel.selectedIndex].textContent = '切换中…';
    site.php = newV;
    setTimeout(() => {
      toast(`✓ ${domain} 已切换到 PHP ${newV}`, 'ok', 2400);
      render();
    }, 900);
  });

  // 侧边栏底部按钮
  $('#refresh-btn').addEventListener('click', () => toast('状态已同步', 'ok', 1400));
  $('#theme-btn').addEventListener('click', openThemePicker);
  $('#cmd-btn').addEventListener('click', openCmdPalette);

  // 抽屉：展开/收起
  $('#drawer-toggle').addEventListener('click', toggleDrawer);

  // 复制日志
  $('#drawer-copy').addEventListener('click', () => {
    if (!state.task) { toast('暂无日志', 'info', 1200); return; }
    const txt = state.task.lines.slice(0, state.task.cursor).map(l => l.s).join('\n');
    copyText(txt).then(ok => toast(ok ? '日志已复制' : '复制失败', ok ? 'ok' : 'err', 1600));
  });

  // 弹窗 / 命令面板遮罩
  document.addEventListener('change', e => {
    if (e.target.id === 'locale-select') setLocale(e.target.value);
  });
  $('#modal-root').addEventListener('click', e => {
    if (e.target.id === 'modal-root' && e.currentTarget.dataset.danger !== '1') closeModal();
    if (e.target.closest('[data-modal-close]')) closeModal();
  });
  $('#cmd-palette').addEventListener('click', e => {
    if (e.target.id === 'cmd-palette') closeCmdPalette();
  });

  // 全局键盘
  document.addEventListener('keydown', e => {
    const modalOpen = $('#modal-root').classList.contains('open');
    const paletteOpen = $('#cmd-palette').classList.contains('open');

    if (e.key === 'Escape') {
      if (paletteOpen) { closeCmdPalette(); return; }
      if (modalOpen) { closeModal(); return; }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      paletteOpen ? closeCmdPalette() : openCmdPalette();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r') {
      e.preventDefault();
      toast('状态已同步', 'ok', 1200);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && /^[1-9]$/.test(e.key)) {
      const idx = parseInt(e.key) - 1;
      const routes = ['sites','php','mysql','pgsql','redis','nginx','go','backup','overview'];
      if (routes[idx]) {
        e.preventDefault();
        state.route = routes[idx];
        render();
        $('#view').scrollTop = 0;
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════════════ */
function initTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
}

function boot() {
  initTheme();
  applyLocaleTexts();
  document.documentElement.lang = locale;
  layout.load();
  setupSidebarResize();
  setupDrawerResize();
  bindEvents();
  render();
  markActivePreset();
}

boot();
</script>
</body>
</html>
