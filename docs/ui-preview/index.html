<style>
:root{
  --bg:#0a0c10; --surface:#11141b; --surface-2:#171b24; --surface-3:#1c2130;

}
[data-theme="oled"]{
  --bg:#000; --surface:#0b0b0e; --surface-2:#111116; --surface-3:#17171d;
  --border:#222229; --border-2:#1a1a20; --text:#ececf2; --text-dim:#9898a6; --text-mute:#64646e;

}
[data-theme="ocean"]{
  --bg:#0a141a; --surface:#0f1c24; --surface-2:#14242e; --surface-3:#1a2d38;

}
[data-theme="violet"]{
  --bg:#0e0b17; --surface:#161024; --surface-2:#1d1630; --surface-3:#241b3a;
  --border:#2b2145; --border-2:#231b38; --text:#eae5f7; --text-dim:#a497c7; --text-mute:#6f648f;

}
[data-theme="sepia"]{
  --bg:#f3ecdd; --surface:#faf5ea; --surface-2:#f1e9d8; --surface-3:#ece2cd;
  --border:#e0d4bd; --border-2:#eae0cc; --text:#3d3227; --text-dim:#6b5d4a; --text-mute:#9a8c74;
  --accent:#b45309; --accent-rgb:180,83,9; --accent-2:#d97706;
  --shadow:0 8px 32px rgba(80,60,20,.12);
}
[data-theme="sakura"]{
  --bg:#fdf3f6; --surface:#fff; --surface-2:#fceef3; --surface-3:#f9e4ec;
  --border:#f2d7e1; --border-2:#f7e3ea; --text:#3a2230; --text-dim:#7a5568; --text-mute:#ab8496;
  --accent:#db2777; --accent-rgb:219,39,119; --accent-2:#ec4899;
  --shadow:0 8px 32px rgba(120,30,70,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed;opacity:.5}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.sidebar{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px 10px;gap:2px}
.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px}
.brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:19px;font-weight:600;flex-shrink:0;box-shadow:0 4px 14px rgba(var(--accent-rgb),.3)}
.brand-name{font-weight:650;letter-spacing:-.3px;font-size:15px}
.brand-status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-mute);margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.dot-warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.dot-err{background:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-section{font-size:10.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13.5px;text-align:left;width:100%;transition:background .12s,color .12s;position:relative}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:550}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0;line-height:1}
.nav-badge{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--text-mute);background:var(--surface-2);padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:rgba(var(--accent-rgb),.18);color:var(--accent)}
.sidebar-foot{display:flex;flex-direction:column;gap:2px;padding-top:10px;margin-top:4px;border-top:1px solid var(--border-2)}
.btn-ghost{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:12.5px;transition:background .12s,color .12s}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.sidebar-foot{position:relative}
.theme-pop{position:absolute;left:10px;bottom:110px;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:none;z-index:120}
.theme-pop.open{display:block}
.theme-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13px;transition:background .12s,color .12s}
.theme-item:hover{background:var(--surface-3);color:var(--text)}
.theme-item.active{background:var(--accent-bg);color:var(--accent)}
.theme-swatch{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1px solid var(--border);background:linear-gradient(135deg,var(--c1) 55%,var(--c2) 55%)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.view{flex:1;overflow-y:auto;min-height:0}
.view-inner{max-width:1200px;margin:0 auto;padding:32px 40px 60px}
.view-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.view-header h1{font-size:24px;font-weight:640;letter-spacing:-.4px;line-height:1.25}
.view-sub{color:var(--text-dim);font-size:13px;margin-top:4px}
.header-actions{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:500;transition:all .13s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(var(--accent-rgb),.22)}
.btn-primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover:not(:disabled){background:var(--danger-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-xs);color:var(--text-dim);transition:background .12s,color .12s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.summary-item{background:var(--surface);padding:16px 18px}
.summary-num{font-size:22px;font-weight:620;font-family:var(--mono);letter-spacing:-.5px;line-height:1.1}
.summary-label{font-size:11.5px;color:var(--text-mute);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.table-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--surface-2)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.site-domain{display:inline-flex;align-items:center;gap:9px;font-weight:550;padding:3px 8px 3px 3px;margin-left:-3px;border-radius:7px;transition:background .13s,color .13s}
.site-domain:hover{background:var(--accent-bg);color:var(--accent)}
.site-domain .favicon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono)}
.svc-cell{display:flex;align-items:center;gap:9px;font-weight:550}
.svc-icon{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.php-select{appearance:none;padding:5px 26px 5px 10px;font-family:var(--mono);font-size:12.5px;border-radius:6px;border:1px solid var(--border);background-color:var(--bg);background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238b95ab' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;color:var(--accent);cursor:pointer;outline:none;min-width:84px;font-weight:550;transition:border-color .12s,box-shadow .12s}
.php-select:hover:not(:disabled){border-color:var(--accent)}
.php-select:disabled{cursor:wait;opacity:.65}
.path-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;border:1px dashed transparent;color:var(--text-dim);font-family:var(--mono);font-size:12px;transition:all .12s;max-width:260px}
.path-btn:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.path-btn .path-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-2);white-space:nowrap}
.chip-accent{background:var(--accent-bg);color:var(--accent);border-color:rgba(var(--accent-rgb),.22)}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--surface-2);color:var(--text-mute)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-err{background:var(--danger-bg);color:var(--danger)}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.row-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.version-card{display:flex;flex-direction:column;gap:14px}
.version-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.version-tag{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.5px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;gap:10px}
.kv .k{color:var(--text-mute);flex-shrink:0}
.kv .v{color:var(--text-dim);font-family:var(--mono);font-size:12px;word-break:break-all;text-align:right;max-width:62%}
.version-card-foot{display:flex;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--border-2);flex-wrap:wrap}
.version-card-foot .btn{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;border:1px dashed var(--border);border-radius:var(--r);background:var(--surface)}
.empty-icon{font-size:42px;opacity:.55;margin-bottom:16px;line-height:1}
.empty h2{font-size:17px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--text-dim);font-size:13.5px;max-width:460px;margin-bottom:22px;line-height:1.65}
.drawer{border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;height:260px;flex-shrink:0;animation:slideUp .2s ease-out}
@keyframes slideUp{from{height:0;opacity:0}to{height:260px;opacity:1}}
.drawer.collapsed{height:42px;overflow:hidden}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:42px;flex-shrink:0;border-bottom:1px solid var(--border-2);background:var(--surface-2)}
.drawer-left{display:flex;align-items:center;gap:10px;min-width:0}
.drawer-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.drawer-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.drawer-dot.running{animation:pulse 1.4s ease-in-out infinite}
.drawer-dot.success{background:var(--ok)}
.drawer-dot.failed{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
.drawer-label{font-size:13px;font-weight:550;white-space:nowrap}
.drawer-cmd{color:var(--text-mute);font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.drawer-status{font-size:11.5px;color:var(--text-mute);font-family:var(--mono)}
.drawer-log{flex:1;overflow-y:auto;padding:12px 16px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--text-dim);white-space:pre-wrap;word-break:break-word;margin:0;background:var(--bg)}
.log-line{color:var(--text-dim)}
.log-line.err{color:var(--danger)}
.log-line.ok{color:var(--ok)}
.log-line.meta{color:var(--accent)}
.log-line.cmd{color:var(--text);font-weight:550}
.log-line.dim{color:var(--text-mute)}
.badge-offline{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);color:var(--ok);background:var(--ok-bg);border-radius:20px;padding:1px 8px;margin-left:8px}
.modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;padding:20px}
.modal-root.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);animation:popIn .18s cubic-bezier(.2,.9,.3,1.15)}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{padding:20px 22px 6px}
.modal-head h3{font-size:17px;font-weight:620;letter-spacing:-.2px}
.modal-head p{color:var(--text-dim);font-size:13px;margin-top:5px}
.modal-body{padding:14px 22px 4px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:550;color:var(--text-dim)}
.field .hint{font-size:11.5px;color:var(--text-mute);line-height:1.5}
input[type="text"],input[type="number"],select{width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .13s,box-shadow .13s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.quick-picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{font-family:var(--mono);font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);transition:all .12s}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.pick.selected{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.cmd-preview{background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--text-dim);word-break:break-all;line-height:1.6}
.cmd-preview .prompt{color:var(--accent);user-select:none}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:18px 22px 20px}
.alert{padding:11px 14px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.6;border:1px solid transparent}
.alert-warn{background:var(--warn-bg);border-color:rgba(var(--warn-rgb),.25);color:var(--warn)}
.alert-danger{background:var(--danger-bg);border-color:rgba(var(--danger-rgb),.25);color:var(--danger)}
.toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 16px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .2s ease-out;pointer-events:auto;max-width:380px;white-space:pre-line}
.toast.ok{border-left:3px solid var(--ok)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}
.cmd-palette{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:15vh;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:150}
.cmd-palette.open{display:flex}
.cmd-palette-box{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:popIn .16s ease-out}
.cmd-palette-box input{width:100%;padding:16px 20px;font-size:15px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--sans);outline:none}
.cmd-palette-list{max-height:320px;overflow-y:auto;padding:8px}
.cmd-palette-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13.5px;cursor:pointer}
.cmd-palette-item:hover,.cmd-palette-item.active{background:var(--accent-bg);color:var(--accent)}
@media (max-width:900px){.app{grid-template-columns:64px 1fr}.brand-meta,.nav-item>span:not(.nav-icon):not(.nav-badge),.nav-section,.sidebar-foot>span{display:none}.brand{justify-content:center;padding:8px 0 18px}.nav-item{justify-content:center;padding:10px}.nav-item.active::before{display:none}.view-inner{padding:24px 20px 40px}.drawer-cmd{display:none}}
</style>
</head>
<body>
<div class="app">

<script>
'use strict';
/* ═══ phpbox Desktop UI 预览 · 演示数据为本机真实状态 ═══ */

const state = {

  task:null,
};
const PHP_EXTS = ['bcmath','exif','gd','imagick','intl','mysqli','opcache','pdo_mysql','pdo_pgsql','pgsql','redis','soap','sockets','xdebug','zip'];
const EXTS_PRESETS = { '默认集': PHP_EXTS, 'minimal': ['opcache','mysqli'], 'web': ['gd','zip','intl','opcache','mysqli','pdo_mysql'], 'debug': ['xdebug','opcache'] };
const SVC_META = {

  mysql:{ title:'MySQL', icon:'🐬', subtitle:'关系型数据库服务', hint:'安装 MySQL，为你的应用准备数据库。', suggested:['8.4','8.0','5.7'] },
  pgsql:{ title:'PostgreSQL', icon:'🐘', subtitle:'对象关系型数据库', hint:'安装 PostgreSQL，断网重装由离线库兜底。', suggested:['17','16','15'] },
  redis:{ title:'Redis', icon:'⚡', subtitle:'内存缓存与数据结构服务', hint:'安装 Redis，为应用提供缓存与会话存储。', suggested:['8','7'] },
  nginx:{ title:'Nginx', icon:'🌐', subtitle:'反向代理与站点入口', hint:'安装 Nginx，站点才能通过域名访问。', suggested:['alpine'], single:true },
};
const NAV = [
  { section:'业务' }, { id:'sites', label:'站点', icon:'🔗' },
  { section:'服务' },
  { id:'php',label:'PHP',icon:'🐘' }, { id:'mysql',label:'MySQL',icon:'🐬' }, { id:'pgsql',label:'PostgreSQL',icon:'🐘' },
  { id:'redis',label:'Redis',icon:'⚡' }, { id:'nginx',label:'Nginx',icon:'🌐' }, { id:'go',label:'Go',icon:'🐹' },
  { section:'运维' }, { id:'backup',label:'备份恢复',icon:'📦' }, { id:'offline',label:'离线缓存',icon:'🗄️' },
  { id:'settings',label:'设置',icon:'⚙️' }, { id:'overview',label:'总览',icon:'◈' },
];
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,kind='info',ttl=3200){
  const el=document.createElement('div');el.className=`toast ${kind}`;el.textContent=msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .2s,transform .2s';el.style.opacity='0';el.style.transform='translateX(12px)';setTimeout(()=>el.remove(),220)},ttl);
}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('已复制','ok',1600)).catch(()=>toast('复制失败','err'))}
function siteUrl(d){const p=String(state.env.NGINX_PORT||'80');return `http://${d}${(p&&p!=='80')?':'+p:''}`}
function cmpVer(a,b){const pa=String(a).split('.'),pb=String(b).split('.');for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=+pa[i]||0,y=+pb[i]||0;if(x!==y)return y-x}return 0}
const containerName=(k,v)=>({php:`php${v.replace('.','')}`,mysql:`mysql${v.replace('.','')}`,pgsql:`pg${v.replace('.','')}`,redis:`redis${v.replace('.','')}`,nginx:'nginx',go:''}[k]||`${k}${v}`);
const pill=(cls,txt)=>`<span class="status-pill ${cls}"><span class="pill-dot"></span>${txt}</span>`;

/* ─── 任务引擎（单队列 + 阶段日志 + 完成回调）─── */
function runTask(label, cli, steps, opts={}){
  if(state.task && state.task.phase==='running'){ toast('有任务正在运行，请稍候（单任务队列）','err'); return; }
  state.task={label,cli,lines:[{t:'$ '+cli,c:'cmd'}],phase:'running',onDone:opts.onDone,doneMsg:opts.doneMsg||('完成: '+label)};
  renderDrawer(); $('#drawer').hidden=false; $('#drawer').classList.remove('collapsed');
  let i=0;
  (function next(){
    const t=state.task; if(!t||t.phase!=='running') return;
    if(i>=steps.length){ t.phase='success'; renderDrawer(); toast(opts.doneMsg||('任务完成: '+label),'ok'); render(); if(opts.onDone) opts.onDone(); return; }
    const st=steps[i++]; (st.lines||[]).forEach(l=>t.lines.push(typeof l==='string'?{t:l,c:''}:l));
    renderDrawerLog(); setTimeout(next, st.d||500);
  })();
}
function renderDrawer(){
  const t=state.task; if(!t) return;
  $('#drawer-label').textContent=t.label; $('#drawer-cmd').textContent='$ '+t.cli;
  $('#drawer-dot').className='drawer-dot '+(t.phase==='running'?'running':t.phase);
  $('#drawer-status').textContent=t.phase==='running'?'进行中…':(t.phase==='success'?'成功 ✓':'失败');
  renderDrawerLog();
}
function renderDrawerLog(){
  const t=state.task; if(!t) return;
  const el=$('#drawer-log'); el.innerHTML=t.lines.map(l=>`<div class="log-line ${l.c||''}">${esc(l.t)}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}
$('#drawer-collapse').addEventListener('click',()=>$('#drawer').classList.toggle('collapsed'));
$('#drawer-copy').addEventListener('click',()=>{ if(state.task) copyText(state.task.lines.map(l=>l.t).join('\n')); });

/* ─── 导航 ─── */
function renderNav(){
  $('#nav').innerHTML=NAV.map(item=>{
    if(item.section) return `<div class="nav-section">${esc(item.section)}</div>`;
    const n=countFor(item.id);
    return `<button class="nav-item ${state.route===item.id?'active':''}" data-route="${item.id}">
      <span class="nav-icon">${item.icon}</span><span>${item.label}</span>${n?`<span class="nav-badge">${n}</span>`:''}</button>`;
  }).join('');
}
function countFor(id){
  if(id==='sites')return state.sites.length||null;
  if(id==='backup')return state.backups.length||null;
  if(id==='offline')return state.offline.trees.length||null;
  return state.installed[id]?state.installed[id].length||null:(id==='go'?state.go.length||null:null);
}
function render(){ const fn=VIEWS[state.route]||VIEWS.sites; $('#view').innerHTML=fn(); renderNav(); }

/* ─── 站点 ─── */
function renderSites(){
  const phpVers=state.installed.php;
  const header=`<header class="view-header"><div><h1>站点</h1>
    <p class="view-sub">点击域名打开 · 行内切换 PHP 版本（乐观更新，失败自动回滚）</p></div>
    <div class="header-actions"><button class="btn btn-primary" data-action="site-add">＋ 新建站点</button></div></header>`;
  if(!state.sites.length) return `<div class="view-inner">${header}<div class="empty"><div class="empty-icon">🌍</div><h2>还没有站点</h2><p>创建第一个站点，就能用浏览器访问本地项目。</p><button class="btn btn-primary" data-action="site-add">新建站点</button></div></div>`;
  const up=state.sites.filter(x=>x.health==='up').length;
  const rows=state.sites.map(s=>{
    const initial=s.domain[0].toUpperCase(), url=siteUrl(s.domain);
    const health={up:pill('pill-ok','正常'),warn:pill('pill-warn','降级'),down:pill('pill-err','未响应')+[` <button class="btn btn-sm" data-action="diagnose" data-domain="${esc(s.domain)}">诊断</button>`]}[s.health];
    const stale=!phpVers.includes(s.php);
    const opts=[...new Set([...phpVers,s.php])].sort(cmpVer).map(v=>`<option value="${esc(v)}"${v===s.php?' selected':''}>${esc(v)}${phpVers.includes(v)?'':'（已卸载）'}</option>`).join('');
    return `<tr>
      <td style="white-space:nowrap"><a class="site-domain" href="${esc(url)}" target="_blank" rel="noopener"><span class="favicon">${esc(initial)}</span>${esc(s.domain)}</a>${s.rewrite?` <span class="chip chip-accent" title="已配置伪静态: ${esc(s.rewrite)}">${esc(s.rewrite)}</span>`:''}</td>
      <td><select class="php-select" data-switch="${esc(s.domain)}"${stale?' style="color:var(--warn)"':''}>${opts}</select></td>
      <td><button class="path-btn" data-action="copy" data-copy="${esc(s.root)}" title="点击复制路径"><span class="path-text">${esc(s.root)}</span></button></td>
      <td>${health}</td>
      <td>${s.hosts?'<span class="chip chip-accent">已解析</span>':`<button class="btn btn-sm" data-action="hosts-add" data-domain="${esc(s.domain)}">加 hosts</button>`}</td>
      <td><div class="row-actions"><button class="icon-btn" title="日志与伪静态" data-action="site-logs" data-domain="${esc(s.domain)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button><button class="icon-btn" title="删除站点" data-action="site-remove" data-domain="${esc(s.domain)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg></button></div></td></tr>`;
  }).join('');
  return `<div class="view-inner">${header}
    <div class="summary">
      <div class="summary-item"><div class="summary-num">${state.sites.length}</div><div class="summary-label">站点</div></div>
      <div class="summary-item"><div class="summary-num">${phpVers.length}</div><div class="summary-label">PHP 版本</div></div>
      <div class="summary-item"><div class="summary-num" style="color:var(--ok)">${up}</div><div class="summary-label">健康</div></div>
      <div class="summary-item"><div class="summary-num">${esc(state.env.NGINX_PORT)}</div><div class="summary-label">Nginx 端口</div></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th style="width:26%">域名</th><th style="width:16%">PHP 版本</th><th style="width:22%">根目录</th><th style="width:14%">健康</th><th style="width:10%">Hosts</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ─── 服务通用视图 ─── */
function renderService(kind){
  const meta=SVC_META[kind], versions=state.installed[kind]||[];
  const header=`<header class="view-header"><div><h1>${meta.title}</h1><p class="view-sub">${meta.subtitle}</p></div>
    <div class="header-actions"><button class="btn btn-primary" data-action="install" data-kind="${kind}">＋ 安装 ${meta.title}</button></div></header>`;
  if(!versions.length) return `<div class="view-inner">${header}<div class="empty"><div class="empty-icon">${meta.icon}</div><h2>还没有安装 ${meta.title}</h2><p>${meta.hint}</p><button class="btn btn-primary" data-action="install" data-kind="${kind}">安装 ${meta.title}</button></div></div>`;
  const cards=versions.map(v=>versionCard(kind,v)).join('');
  return `<div class="view-inner">${header}<div class="grid grid-3">${cards}</div></div>`;
}
function versionCard(kind,v){
  const port=state.ports[`${kind}.${v}`]||'';
  const extras=[];
  if(port) extras.push(`<div class="kv"><span class="k">端口</span><span class="v">${esc(port)}</span></div>`);
  if(kind==='php'){const en=(state.phpExts&&state.phpExts[v])?state.phpExts[v].enabled.length:PHP_EXTS.length;
    extras.push(`<div class="kv"><span class="k">扩展</span><span class="v">${en} 个</span></div>`);}
  if(kind==='mysql'||kind==='pgsql'){
    const key=`${kind}.${v}`, masked=state.passwords[key]?'••••••••':'—';
    extras.push(`<div class="kv"><span class="k">密码</span><span class="v" id="pw-${kind}-${v.replace('.','')}">${masked}</span></div>`);
  }
  extras.push(`<div class="kv"><span class="k">配置</span><span class="v">config/${kind}/${v}/</span></div>`);
  extras.push(`<div class="kv"><span class="k">容器</span><span class="v">${esc(containerName(kind,v))}</span></div>`);
  let btns='';
  if(kind==='php') btns+=`<button class="btn btn-sm" data-action="php-ext" data-version="${esc(v)}">扩展</button>`;
  if(kind==='mysql'||kind==='pgsql'){
    btns+=`<button class="btn btn-sm" data-action="pw-reveal" data-key="${kind}.${v}">显示密码</button>`;
    btns+=`<button class="btn btn-sm" data-action="pw-dsn" data-key="${kind}.${v}">复制 ${kind==='mysql'?'CLI':'URL'}</button>`;
  }
  if(kind==='nginx') btns+=`<button class="btn btn-sm" data-action="run" data-task="nginx-reload">重载配置</button>`;
  btns+=`<button class="btn btn-sm btn-danger" data-action="uninstall" data-kind="${kind}" data-version="${esc(v)}">卸载</button>`;
  return `<article class="card version-card">
    <div class="version-card-head"><span class="version-tag">${esc(v)}</span>${pill('pill-ok','运行中')}</div>
    <div>${extras.join('')}</div>
    <div class="version-card-foot">${btns}</div></article>`;
}

/* ─── Go ─── */
function renderGo(){
  const rows=state.go.map(p=>`<tr>
    <td><div class="svc-cell"><span class="svc-icon">🐹</span>${esc(p.name)}</div></td>
    <td><span class="chip">${esc(p.version)}</span></td>
    <td><span class="mono" style="color:var(--text-dim)">${p.port}</span></td>

    <td><div class="row-actions">
      <button class="btn btn-sm" data-action="run" data-task="go-run" data-arg="${esc(p.name)}">运行</button>
      <button class="btn btn-sm" data-action="run" data-task="go-shell" data-arg="${esc(p.name)}">Shell</button>
      <button class="btn btn-sm" data-action="run" data-task="go-stop" data-arg="${esc(p.name)}">停止</button>

    <header class="view-header"><div><h1>Go 项目</h1><p class="view-sub">自动发现 ${esc(state.env.GO_PROJECTS_ROOT)} 下的 go.mod 项目 · 不发布宿主端口，经 <span class="mono">&lt;项目&gt;.test</span> 访问</p></div>
    <div class="header-actions"><button class="btn" data-action="run" data-task="go-list">查看镜像</button><button class="btn btn-primary" data-action="run" data-task="go-server">扫描项目</button></div></header>
    ${state.go.length?`<div class="table-wrap"><table><thead><tr><th style="width:30%">项目</th><th style="width:15%">版本</th><th style="width:12%">端口</th><th style="width:15%">状态</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="empty"><div class="empty-icon">🐹</div><h2>未发现 Go 项目</h2><p>项目放在 <span class="mono">${esc(state.env.GO_PROJECTS_ROOT)}</span> 下且含 <span class="mono">go.mod</span> 即自动识别。</p><button class="btn btn-primary" data-action="run" data-task="go-server">扫描项目</button></div>`}</div>`;
}

/* ─── 备份 ─── */
function renderBackup(){
  const rows=state.backups.map(b=>`<tr>
    <td><span class="mono" style="font-size:12.5px">${esc(b.file)}</span></td>
    <td><span class="mono" style="color:var(--text-dim)">${esc(b.size)}</span></td>
    <td><span class="mono" style="color:var(--text-mute);font-size:12px">${esc(b.at)}</span></td>
    <td><div class="row-actions"><button class="btn btn-sm" data-action="restore" data-file="${esc(b.file)}">恢复</button>
    <button class="btn btn-sm" data-action="download-archive" data-file="${esc(b.file)}" data-size="${esc(b.size)}">下载</button>

function openModal(html){const r=$('#modal-root');r.innerHTML=html;r.classList.add('open');}

function modalCmdPreview(sel,html){$(sel).innerHTML=`<span class="prompt">$ </span>${html}`;}

// 危险操作统一二次确认弹窗（UI 规格 §7.1：数据删除双保险、配置类单确认）
// requireInput = { hint, value }：输入匹配后才解锁确认按钮（最高档，用于 --purge）
function openConfirmModal({ title, desc = '', warnHtml = '', requireInput = null, actionLabel = '确认', onConfirm }) {
  openModal(`<div class="modal"><div class="modal-head"><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>
    <div class="modal-body">${warnHtml}
    ${requireInput?`<div class="field"><label>${esc(requireInput.hint)}</label><input id="m-req" type="text" autocomplete="off" placeholder="${esc(requireInput.value)}"></div>`:''}</div>
    <div class="modal-foot"><button class="btn" data-modal-close>取消</button>
    <button class="btn btn-danger" id="m-ok" style="background:var(--danger-bg);border-color:rgba(var(--danger-rgb),.3)" ${requireInput?'disabled':''}>${actionLabel}</button></div></div>`);
  if (requireInput) {
    $('#m-req').addEventListener('input', e => { $('#m-ok').disabled = e.target.value.trim() !== requireInput.value; });
    setTimeout(() => $('#m-req').focus(), 60);
  }
  $('#modal-root').onkeydown = e => { if (e.key === 'Escape') closeModal(); };
  $('#m-ok').addEventListener('click', () => { closeModal(); onConfirm(); });
}
function openInstallModal(kind){

  };
  $$('.pick').forEach(p=>p.addEventListener('click',()=>{$$('.pick').forEach(x=>x.classList.remove('selected'));p.classList.add('selected');purge=p.dataset.purge==='yes';if(purge){$('#m-req')&&($('#m-req').value='')}upd()}));
  $('#modal-root').oninput=e=>{if(e.target.id==='m-req')upd()};
  upd();
  $('#modal-root').onkeydown=e=>{if(e.key==='Escape')closeModal()};
  $('#m-ok').addEventListener('click',()=>{
    if(purge&&$('#m-req').value.trim()!==v){toast('请输入版本号以确认 --purge','err');return}
    closeModal();
    runTask(`卸载 ${meta.title} ${v}${purge?'（含数据）':''}`,`phpbox ${kind} uninstall ${v}${purge?' --purge':''}`,
      [{d:400,lines:[{t:'[INFO] 卸载 '+kind+' '+v+'，停止容器...',c:''}]},
       {d:600,lines:[{t:purge?'[INFO] --purge：清理数据目录（容器兜底）...':'[INFO] 数据目录和配置已保留',c:'dim'}]},
       {d:400,lines:[{t:'[OK] '+meta.title+' '+v+' 已卸载',c:'ok'}]}],
      {doneMsg:'已卸载',onDone(){state.installed[kind]=state.installed[kind].filter(x=>x!==v);render()}});
  });
}
function openSiteAddModal(){
  const phpVers=state.installed.php;
  if(!phpVers.length){toast('请先安装一个 PHP 版本','err');return}
  openModal(`<div class="modal"><div class="modal-head"><h3>新建站点</h3><p>生成 Nginx vhost 并绑定 PHP 版本</p></div>
    <div class="modal-body">
      <div class="field"><label>域名</label><input id="m-domain" type="text" placeholder="例如 demo.test"><div class="hint">建议 <span class="mono">.test</span> 后缀避免与真实域名冲突。</div></div>
      <div class="field"><label>PHP 版本</label><select id="m-php">${phpVers.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>
      <div class="field"><label>站点目录</label><input id="m-root" type="text" placeholder="~/www/demo"></div>
      <div class="field"><label>将执行</label><div class="cmd-preview" id="m-preview"></div></div></div>
    <div class="modal-foot"><button class="btn" data-modal-close>取消</button><button class="btn btn-primary" id="m-ok">创建站点</button></div></div>`);
  const d=$('#m-domain'),p=$('#m-php'),r=$('#m-root');
  const upd=()=>{const dd=(d.value||'').trim()||'<域名>';modalCmdPreview('#m-preview',esc(`phpbox site add ${dd} --php ${p.value}`));if(d.value&&!r.dataset.touched)r.value=`${state.env.WWW_ROOT}/${d.value.replace(/\.test$/,'')}`};
  d.addEventListener('input',upd);p.addEventListener('change',upd);r.addEventListener('input',()=>r.dataset.touched='1');
  upd(); setTimeout(()=>d.focus(),60);
  $('#modal-root').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#m-ok').click()}if(e.key==='Escape')closeModal()};
  $('#m-ok').addEventListener('click',()=>{
    const dd=(d.value||'').trim();
    if(!dd){toast('请输入域名','err');return}
    if(!/^[a-zA-Z0-9.-]+$/.test(dd)){toast('域名格式不正确','err');return}
    closeModal();
    runTask(`创建站点 ${dd}`,`phpbox site add ${dd} --php ${p.value}`,
      [{d:400,lines:[{t:'[INFO] 生成 vhost: config/nginx/sites/'+dd+'.conf',c:''}]},
       {d:600,lines:[{t:'[INFO] nginx -t 校验通过',c:'ok'}]},
       {d:400,lines:[{t:'[INFO] reload nginx',c:'dim'}]},
       {d:300,lines:[{t:'[OK] 站点创建成功: '+siteUrl(dd),c:'ok'}]}],
      {doneMsg:'站点创建成功',onDone(){state.sites.push({domain:dd,php:p.value,root:`${state.env.WWW_ROOT}/${dd.replace(/\.test$/,'')}`,hosts:false,health:'up'});render()}});
  });
}
function openRestoreModal(file){
  openModal(`<div class="modal"><div class="modal-head"><h3>恢复备份</h3><p>${esc(file)}</p></div>
    <div class="modal-body">
      <div class="alert alert-danger">恢复将<strong>覆盖</strong>以下路径（相对根目录）：</div>
      <div class="cmd-preview">home/kentrl/phpbox/.env<br>home/kentrl/phpbox/config/<br>home/kentrl/phpbox/offline/<br>home/kentrl/phpbox/phpbox-dbdata-mysql.tar.gz<br>home/kentrl/phpbox/phpbox-dbdata-pgsql.tar.gz<br>home/kentrl/www/<br>home/kentrl/mysql-data/<br>home/kentrl/pgsql-data/</div>
      <div class="field"><label><input type="checkbox" id="m-confirm" style="width:auto"> 我了解将覆盖现有数据（不可撤销）</label></div>
      <div class="alert alert-warn">恢复会暂停 MySQL / PostgreSQL / Redis，完成后自动重启；数据库数据由容器 root 解包以保留 uid 属主。</div></div>
    <div class="modal-foot"><button class="btn" data-modal-close>取消</button><button class="btn btn-danger" id="m-ok" disabled style="background:var(--danger-bg);border-color:rgba(var(--danger-rgb),.3)">确认恢复</button></div></div>`);
  $('#m-confirm').addEventListener('change',e=>{$('#m-ok').disabled=!e.target.checked});
  $('#modal-root').onkeydown=e=>{if(e.key==='Escape')closeModal()};
  $('#m-ok').addEventListener('click',()=>{
    closeModal();
    runTask('恢复备份 '+file,'phpbox restore '+file,
      [{d:400,lines:[{t:'[INFO] 停止 MySQL/PostgreSQL/Redis...',c:''}]},
       {d:700,lines:[{t:'[INFO] 主归档解包（-m，保留路径白名单）...',c:'dim'}]},
       {d:600,lines:[{t:'[INFO] 恢复卷: phpbox_redis8_data',c:'dim'}]},
       {d:600,lines:[{t:'[INFO] 恢复数据库数据目录: phpbox-dbdata-mysql.tar.gz（容器 root·保留 uid）',c:'meta'},{t:'[INFO] 恢复数据库数据目录: phpbox-dbdata-pgsql.tar.gz（容器 root·保留 uid）',c:'meta'}]},
       {d:500,lines:[{t:'[INFO] 重启服务 + nginx reload',c:'dim'}]},
       {d:400,lines:[{t:'[OK] 恢复完成，已自动重启被暂停的服务',c:'ok'}]}],
      {doneMsg:'恢复完成'});
  });
}
function openDiagnoseModal(domain){
  openModal(`<div class="modal"><div class="modal-head"><h3>诊断 · ${esc(domain)}</h3><p>站点未响应 · 引擎按已知故障模式匹配</p></div>
    <div class="modal-body">
      <div class="field"><label>最近事件</label><div class="cmd-preview">站点 HEAD 探测失败（connection refused）<br>绑定 PHP 实例: php7.4 → healthy ✓<br>hosts: 已解析 ✓<br>nginx: healthy ✓</div></div>
      <div class="field"><label>建议修复（按置信度排序）</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="card" style="padding:12px"><strong style="font-size:13px">1. 重启绑定的 PHP 实例并复检</strong><div class="hint">站点返回 5xx 且绑定实例刚被重建时常见；CLI: <span class="mono">phpbox php list</span></div><button class="btn btn-sm btn-primary" style="margin-top:8px" data-action="run" data-task="php-restart" data-arg="7.4" data-modal-close>一键修复</button></div>
          <div class="card" style="padding:12px"><strong style="font-size:13px">2. 检查站点根目录文件</strong><div class="hint">404 时常见；打开目录确认 index.php 存在</div></div>
        </div></div></div>
    <div class="modal-foot"><button class="btn" data-modal-close>关闭</button></div></div>`);
  $('#modal-root').onkeydown=e=>{if(e.key==='Escape')closeModal()};
}
const TASKS={
  'backup':{label:'创建备份',cli:'phpbox backup',steps:[{d:400,lines:[{t:'[INFO] 暂停 MySQL/PostgreSQL/Redis...',c:''}]},{d:800,lines:[{t:'[INFO] 打包数据库数据目录（容器 root·保留 uid）: mysql 5.7/8.0/8.4、pgsql 17',c:'meta'}]},{d:600,lines:[{t:'[INFO] 打包 .env / config / offline / www...',c:'dim'}]},{d:500,lines:[{t:'[OK] 备份完成: backups/backup-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-nnnn.tar.gz',c:'ok'}]}],done(){state.backups.unshift({file:'backup-20260913-1200.tar.gz',size:'1.3 GB',at:'刚刚'});render()}},
  'nginx-reload':{label:'Nginx 重载配置',cli:'phpbox nginx reload',steps:[{d:400,lines:[{t:'[INFO] nginx -t 校验通过',c:'ok'}]},{d:400,lines:[{t:'[OK] nginx reload 完成',c:'ok'}]}]},
  'doctor':{label:'环境诊断',cli:'phpbox doctor',steps:[{d:400,lines:[{t:'[OK] Docker daemon 可达',c:'ok'}]},{d:300,lines:[{t:'[OK] bash ≥ 4.4 / openssl / compose 插件就绪',c:'ok'}]},{d:300,lines:[{t:'[OK] 离线库完整（10 条目，1.3 GB）',c:'ok'}]}]},
  'offline-verify-all':{label:'离线缓存全部校验',cli:'phpbox offline verify --all',steps:[{d:500,lines:[{t:'[INFO] 校验 php 8.4/8.2/8.0/7.4 ... ✓',c:'ok'}]},{d:500,lines:[{t:'[INFO] 校验 mysql 8.4/8.0/5.7 ... ✓',c:'ok'}]},{d:400,lines:[{t:'[OK] 10 条目全部通过（1.3 GB）',c:'ok'}]}]},
  'offline-preload':{label:'预下载 mysql 8.2',cli:'phpbox offline preload mysql 8.2',steps:[{d:600,lines:[{t:'[INFO] 在线拉取 mysql:8.2 ...',c:'dim'}]},{d:700,lines:[{t:'[INFO] 回写离线库: offline/mysql/8.2/mysql-8.2.tar',c:'meta'}]},{d:400,lines:[{t:'[OK] 已入离线库',c:'ok'}]}],done(){render()}},
  'go-list':{label:'查看 Go 镜像',cli:'phpbox go list',steps:[{d:400,lines:[{t:'golang:alpine  已下载',c:''},{t:'golang:1.24-alpine  已下载',c:''}]}]},
  'go-server':{label:'扫描 Go 项目',cli:'phpbox go server',steps:[{d:500,lines:[{t:'[INFO] 扫描 ~/www ...',c:'dim'}]},{d:400,lines:[{t:'发现 2 个项目: my-app, api-gate',c:'ok'}]}]},
  'php-restart':{label:'重启 PHP 7.4 实例',cli:'phpbox php restart 7.4',steps:[{d:500,lines:[{t:'[INFO] 重启 php74 容器...',c:'dim'}]},{d:500,lines:[{t:'[OK] 容器 healthy',c:'ok'}]}],done(){const s=state.sites.find(x=>x.domain==='legacy.test');if(s)s.health='up';render();toast('legacy.test 已恢复，健康转绿','ok')}},
};
[['go-run','运行 Go 项目'],['go-shell','进入 Go Shell'],['go-stop','停止 Go 项目']].forEach(([id,label])=>{
  TASKS[id]={label,cli:'phpbox go '+(id==='go-run'?'run':id==='go-shell'?'shell':'stop')+' <项目>',steps:[{d:500,lines:[{t:'[INFO] 执行中...',c:'dim'}]},{d:400,lines:[{t:'[OK] 完成',c:'ok'}]}]};
});
[['offline-verify','校验离线缓存'],['offline-prune','清理离线缓存']].forEach(([id,label])=>{

});

/* ─── 事件委托 ─── */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-route]'); if(nav){state.route=nav.dataset.route;render();return}
  const jump=e.target.closest('[data-route-jump]'); if(jump){state.route=jump.dataset.routeJump;render();return}
  const act=e.target.closest('[data-action]'); if(!act) return;
  const a=act.dataset.action;
  if(a==='install') openInstallModal(act.dataset.kind);
  else if(a==='uninstall') openUninstallModal(act.dataset.kind,act.dataset.version);
  else if(a==='php-ext') openExtModal(act.dataset.version);
  else if(a==='site-add') openSiteAddModal();
  else if(a==='site-remove'){const d=act.dataset.domain;openModal(`<div class="modal"><div class="modal-head"><h3>删除站点 ${esc(d)}</h3><p>移除 vhost 并重载。站点目录不会自动删除；失败自动恢复配置。</p></div><div class="modal-body"><div class="field"><label>将执行</label><div class="cmd-preview"><span class="prompt">$ </span>phpbox site remove ${esc(d)}</div></div></div><div class="modal-foot"><button class="btn" data-modal-close>取消</button><button class="btn btn-danger" id="m-ok" style="background:var(--danger-bg);border-color:rgba(var(--danger-rgb),.3)">删除</button></div></div>`);
    $('#modal-root').onkeydown=e=>{if(e.key==='Escape')closeModal()};
    $('#m-ok').addEventListener('click',()=>{closeModal();runTask('删除站点 '+d,'phpbox site remove '+d,[{d:400,lines:[{t:'[INFO] 移除 vhost...',c:''}]},{d:400,lines:[{t:'[OK] 已删除并重载',c:'ok'}]}],{doneMsg:'站点已删除',onDone(){state.sites=state.sites.filter(x=>x.domain!==d);render()}})});}
  else if(a==='hosts-add'){const d=act.dataset.domain;toast('需要提权写入 /etc/hosts（桌面版走特权助手）','info',4000);setTimeout(()=>{const s=state.sites.find(x=>x.domain===d);if(s)s.hosts=true;render();toast('hosts 已添加','ok')},900)}
  else if(a==='diagnose') openDiagnoseModal(act.dataset.domain);
  else if(a==='site-logs') openSiteLogsModal(act.dataset.domain);
  else if(a==='download-archive') downloadArchive(act.dataset.file,act.dataset.size);
  else if(a==='copy') copyText(act.dataset.copy);
  else if(a==='pw-dsn'){const k=act.dataset.key,[k1,v]=k.split('.');copyText(k1==='mysql'?`mysql -h127.0.0.1 -P${state.ports[k]} -uroot -p`:`postgresql://postgres:<密码>@127.0.0.1:${state.ports[k]}/postgres`)}
  else if(a==='pw-reveal'){const k=act.dataset.key,id='pw-'+k.replace('.','-'),el=document.getElementById(id);if(!el)return;el.textContent=state.passwords[k]||'—';toast('8 秒后自动掩码','info',1500);setTimeout(()=>{el.textContent='••••••••'},8000)}
  else if(a==='settings-save'){const changed=$$('[data-env-key]').filter(i=>state.env[i.dataset.envKey]!==undefined&&state.env[i.dataset.envKey]!==i.value);changed.forEach(i=>state.env[i.dataset.envKey]=i.value);toast(changed.length?`已写入 .env（${changed.length} 项）`:'没有变更','ok')}
  else if(a==='restore') openRestoreModal(act.dataset.file);
  else if(a==='backup-del'){const f=act.dataset.file;
    openConfirmModal({title:'删除备份归档',desc:esc(f),
      warnHtml:'<div class="alert alert-danger">删除后该恢复点<strong>永久丢失</strong>，无法撤销。若这是唯一备份，环境将失去回滚能力。</div>',
      actionLabel:'删除归档',
      onConfirm(){state.backups=state.backups.filter(b=>b.file!==f);render();toast('归档已删除','ok')}});}
  else if(a==='run'){const t=TASKS[act.dataset.task];if(!t)return;
    const taskLabel=t.label+(act.dataset.arg?' · '+act.dataset.arg:'');
    const taskCli=t.cli+(act.dataset.arg?' '+act.dataset.arg:'');
    if(act.dataset.task==='offline-prune'){
      openConfirmModal({title:'清理离线缓存',desc:act.dataset.arg||'全部条目',
        warnHtml:'<div class="alert alert-warn">清理后该条目将从 <span class="mono">offline/</span> 删除，<strong>下次安装将重新联网拉取并自动回写</strong>。断网期间将无法零网络安装对应版本。</div>',
        actionLabel:'清理',
        onConfirm(){runTask(taskLabel,taskCli,t.steps,{doneMsg:'完成',onDone:t.done})}});
      return;
    }
    runTask(taskLabel,taskCli,t.steps,{doneMsg:'完成',onDone:t.done})}
});
document.addEventListener('change',e=>{
  const sel=e.target.closest('[data-switch]'); if(!sel) return;
  const domain=sel.dataset.switch,newV=sel.value,site=state.sites.find(x=>x.domain===domain);
  if(!site||site.php===newV) return;
  const old=site.php; site.php=newV; sel.disabled=true;
  toast('切换中…','info',1500);
  setTimeout(()=>{
    site.php=old; /* 演示：模拟引擎校验失败自动回滚 */
    sel.disabled=false; render();
    toast(`切换 ${domain} → ${newV} 失败已回滚（演示：模拟 nginx 校验失败）`,'err',4200);
  },1600);
});
$('#refresh-btn').addEventListener('click',()=>{render();toast('状态已同步','ok',1500)});
const THEMES=[
  {id:'dark',name:'夜航',c1:'#0a0c10',c2:'#5b9cff'},
  {id:'light',name:'晨白',c1:'#f6f7f9',c2:'#5b9cff'},
  {id:'oled',name:'纯黑',c1:'#000000',c2:'#55a6ff'},
  {id:'ocean',name:'深海',c1:'#0a141a',c2:'#2dd4bf'},
  {id:'violet',name:'紫夜',c1:'#0e0b17',c2:'#a78bfa'},
  {id:'sepia',name:'暖纸',c1:'#f3ecdd',c2:'#b45309'},
  {id:'sakura',name:'樱语',c1:'#fdf3f6',c2:'#db2777'},
];
function applyTheme(id){
  state.theme=id;document.documentElement.dataset.theme=id;
  try{localStorage.setItem('phpbox-theme',id)}catch{}
  $('#theme-name').textContent=(THEMES.find(t=>t.id===id)||THEMES[0]).name;
  $$('#theme-pop .theme-item').forEach(el=>el.classList.toggle('active',el.dataset.themeId===id));
}
$('#theme-pop').innerHTML=THEMES.map(t=>`<button class="theme-item" data-theme-id="${t.id}">
  <span class="theme-swatch" style="--c1:${t.c1};--c2:${t.c2}"></span><span>${t.name}</span></button>`).join('');
$('#theme-btn').addEventListener('click',e=>{e.stopPropagation();$('#theme-pop').classList.toggle('open')});
$('#theme-pop').addEventListener('click',e=>{const b=e.target.closest('[data-theme-id]');if(!b)return;applyTheme(b.dataset.themeId);$('#theme-pop').classList.remove('open')});
document.addEventListener('click',e=>{if(!e.target.closest('#theme-pop,#theme-btn'))$('#theme-pop').classList.remove('open')});
applyTheme((()=>{try{return localStorage.getItem('phpbox-theme')}catch{return null}})()||'dark');
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='r'){e.preventDefault();render();toast('状态已同步','ok',1200)}
  else if(e.key==='Escape'){closeModal();$('#cmd-palette').classList.remove('open')}
  else if((e.ctrlKey||e.metaKey)&&/^[1-9]$/.test(e.key)){const ids=NAV.filter(x=>x.id);const t=ids[+e.key-1];if(t){e.preventDefault();state.route=t.id;render()}}
});
$('#cmd-btn').addEventListener('click',openPalette);
const PALETTE_ITEMS=[...NAV.filter(x=>x.id).map(x=>({label:'前往 '+x.label,run(){state.route=x.id;render()}})),
  {label:'环境诊断',run(){state.route='overview';render();runTask(TASKS.doctor.label,TASKS.doctor.cli,TASKS.doctor.steps)}},
  {label:'离线缓存全部校验',run(){state.route='offline';render();runTask(TASKS['offline-verify-all'].label,TASKS['offline-verify-all'].cli,TASKS['offline-verify-all'].steps)}},
  {label:'复制 MySQL 8.4 连接命令',run(){copyText('mysql -h127.0.0.1 -P3384 -uroot -p')}}];
function openPalette(){$('#cmd-palette').classList.add('open');const i=$('#cmd-input');i.value='';renderPalette('');setTimeout(()=>i.focus(),50)}
function renderPalette(q){
  const items=PALETTE_ITEMS.filter(x=>x.label.toLowerCase().includes(q.toLowerCase()));
  $('#cmd-list').innerHTML=items.map((x,i)=>`<div class="cmd-palette-item ${i===0?'active':''}" data-pi="${esc(x.label)}">${esc(x.label)}</div>`).join('')||'<div class="cmd-palette-item">无匹配</div>';
  $$('#cmd-list .cmd-palette-item').forEach(el=>el.addEventListener('click',()=>{const it=PALETTE_ITEMS.find(x=>x.label===el.dataset.pi);$('#cmd-palette').classList.remove('open');if(it)it.run()}));
}
$('#cmd-input').addEventListener('input',e=>renderPalette(e.target.value));
$$('#cmd-list').length;

render();
</script>
